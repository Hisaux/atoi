<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tour de jeu">
<meta name="theme-color" content="#eef2fa">
<title>À qui le tour ?</title>
<style>
  :root{
    --ink:#1b2233;
    --ink2:rgba(27,34,51,.6);
    --glass:rgba(255,255,255,.52);
    --edge:rgba(255,255,255,.85);
    --sz:clamp(130px,calc(100vh - 520px),min(86vw,360px)); /* côté du stage carré : laisse la place aux éléments autour */
    --bg:radial-gradient(60% 50% at 15% 8%,#bcd6ff 0,transparent 62%),
         radial-gradient(50% 45% at 92% 18%,#ffd1e4 0,transparent 62%),
         radial-gradient(60% 50% at 70% 96%,#c6f1dc 0,transparent 62%),
         #eef2fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;color-scheme:light}

  @supports (height:100dvh){:root{--sz:clamp(130px,calc(100dvh - 520px),min(86vw,360px))}}
  .screen{display:none;position:fixed;inset:0;padding:max(22px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));overflow-y:auto}
  .screen.on{display:flex;flex-direction:column}
  .wrap{width:100%;max-width:460px;margin:0 auto}
  #home .wrap{margin:0 auto}
  #lobby,#who{padding-top:calc(max(22px,env(safe-area-inset-top)) + 34px)}   /* sous le bouton de déconnexion */

  /* ---------- Verre liquide ---------- */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
    border:1px solid var(--edge);
    box-shadow:0 10px 34px rgba(40,60,110,.14),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25);
    border-radius:28px;
  }
  .card{padding:20px;margin:14px 0}
  .pill{
    display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
    background:rgba(255,255,255,.55);border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 6px 20px rgba(40,60,110,.14),inset 0 1px 0 rgba(255,255,255,.95);
  }

  h1{
    font-size:44px;
    font-weight:600;
    letter-spacing:-.02em;
    margin:8px 0 24px 24px;
    text-align:center;
  }
  h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 12px}
  .lead{color:var(--ink2);font-size:17px;margin:0 0 14px}
  .lab{display:block;font-size:16px;font-weight:700;letter-spacing:.06em;color:var(--ink2);margin:0 0 10px}

  input[type=text]{
    width:100%;padding:15px 16px;font:inherit;font-size:18px;border-radius:8px;
    border:1px solid lightgray;background:rgba(255,255,255,.62);color:var(--ink);
  }
  input:focus,input:focus-visible{outline:none;box-shadow:none}
  input[type=text].bad{border-color:#d93025}
  .h2row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:0 0 12px}
  .h2row h2{margin:0}
  button.sm{font-size:13px;padding:6px 12px}
  input::placeholder{color:rgba(27,34,51,.4)}
  input[type=color]{width:54px;height:54px;padding:4px;border:1px solid var(--edge);border-radius:50%;background:rgba(255,255,255,.62);flex:0 0 54px;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
  input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
  input[type=color].bad{border:3px solid #d93025}
  .colrow{display:flex;align-items:center;gap:10px;margin:14px 0 4px}     /* pastilles à gauche, « + » aligné sous le rond pcolor */
  .swatches{flex:1;min-width:0;display:grid;grid-template-columns:repeat(6,1fr);gap:10px 6px;justify-items:center}   /* deux lignes de 6, ordre arc-en-ciel */
  button.sw{width:100%;max-width:38px;aspect-ratio:1/1;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.22)}
  button.more{flex:0 0 54px;width:54px;height:54px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.22);
    background:conic-gradient(#e53935,#fb8c00,#fdd835,#43a047,#4fc3f7,#4169e1,#8e24aa,#f06292,#e53935);
    color:#fff;font-size:32px;font-weight:700;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  button.sw.sel{box-shadow:0 0 0 3px var(--ink)}
  button.sw.taken{opacity:.3}

  button{
    font:inherit;font-size:18px;font-weight:400;padding:12px 24px;border-radius:60px;cursor:pointer;
    color:var(--ink);background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:transform .12s;
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45}
  button.pri{
    color:#fff;background:#2d69eb;
  }
  button.link{
    background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;
    padding:4px 0;font-size:14px;font-weight:500;color:#2d69eb;
  }
  .row{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0}
  .row>*{flex:1}
  .row>button{flex:0 0 auto;max-width:100%}
  .row.btns2>button{flex:1}

  .err{color:#d93025;margin-top:10px;min-height:20px;font-size:15px}
  #nameErr{margin:0;line-height:20px;text-align:center}
  .hint{color:var(--ink2);font-size:14px;margin:10px 0 0;line-height:1.4}
  .hint.ctr{text-align:center}

  /* préparation */
  .codeval{font-size:36px;font-weight:700;letter-spacing:.04em;text-align:center;margin:8px 0 6px;word-break:break-all}
  .pl{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:10px 0;border-radius:22px;
    background:rgba(255,255,255,.55);border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 6px 20px rgba(40,60,110,.12),inset 0 1px 0 rgba(255,255,255,.95)}
  .pl .dot{width:30px;height:30px;border-radius:50%;flex:0 0 30px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.22);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;line-height:1}
  .pl .nm{flex:1;min-width:0;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl button{padding:8px 11px;font-size:16px;border-radius:14px;flex:0 0 auto}
  label.opt{display:flex;align-items:flex-start;gap:14px;padding:12px 4px;font-size:17px;font-weight:600;line-height:1.3;cursor:pointer}
  label.opt input{flex:0 0 26px;width:26px;height:26px;margin:-2px 0 0;accent-color:#2d69eb}
  label.opt small{font-weight:400;color:var(--ink2);font-size:14px}
  /* « 1 » dans le dot du 1er joueur ; « er » toujours en exposant */
  sup{font-size:.62em;line-height:0}
  .npill{display:inline-block;max-width:100%;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700;line-height:1.2;
    border:1px solid rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(40,60,110,.18),inset 0 1px 0 rgba(255,255,255,.5);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  .claimbtn{display:block;width:100%;margin:8px 0;padding:14px;font-size:19px;border-radius:20px;border:1px solid rgba(255,255,255,.7);overflow-wrap:anywhere}
  .claimbtn.sel{box-shadow:0 0 0 3px var(--ink)}
  .claimbtn small{display:block;font-size:13px;opacity:.85}
  /* favoris : étoile à côté du prénom, autocomplétion du prénom */
  .pl button.star{background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 6px;font-size:22px;line-height:1;color:#e0a800;vertical-align:-2px}
  .acwrap{position:relative;flex:1}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;display:none;background:rgba(255,255,255,.97);border:1px solid var(--edge);border-radius:12px;box-shadow:0 10px 30px rgba(40,60,110,.2);overflow:hidden}
  .sugg.on{display:block}
  .sugg button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:0;background:none;padding:12px 14px;font-size:17px;text-align:left;-webkit-backdrop-filter:none;backdrop-filter:none}
  .sugg button+button{border-top:1px solid rgba(27,34,51,.08)}
  .sugg button.act{background:rgba(45,105,235,.14)}
  .stt input.num{width:68px;padding:8px 6px;font:inherit;font-size:16px;text-align:center;border-radius:8px;border:1px solid lightgray;background:rgba(255,255,255,.7);color:var(--ink)}
  .stt input.num:focus{outline:none}

  /* écran de jeu */
  #game{padding:0}
  #gback{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:5}
  #top{display:flex;flex-direction:column;align-items:center;gap:6px;padding:calc(max(14px,env(safe-area-inset-top)) + 42px) 14px 0;position:relative;z-index:4}
  #strip{padding:9px 14px;gap:9px;flex-wrap:wrap;justify-content:center}
  #strip .chip{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1;transition:transform .2s,opacity .2s}
  #strip .chip.dim{opacity:.3}
  #strip .chip.act{transform:scale(1.3);box-shadow:0 0 0 3px rgba(27,34,51,.85)}
  #turnno{font-size:14px;font-weight:600;color:var(--ink2);padding:6px 14px;cursor:pointer}
  #cd{font-size:14px;font-weight:700;color:var(--ink);padding:6px 14px;text-align:center;font-variant-numeric:tabular-nums;max-width:92vw;line-height:1.3}
  #cd.low{color:#d93025}
  .cdrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:2px 4px 10px 44px;font-size:16px;font-weight:600}
  .cdrow input{width:84px;padding:8px 6px;font:inherit;font-size:16px;text-align:center;border-radius:8px;border:1px solid lightgray;background:rgba(255,255,255,.7);color:var(--ink)}
  .cdrow input:focus{outline:none}
  .pl .tag{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--ink2);padding:3px 8px;border-radius:999px;background:rgba(27,34,51,.08)}
  .claimbtn:disabled{opacity:.4;filter:grayscale(.6)}
  #timer{font-size:14px;font-weight:600;color:var(--ink2);padding:6px 14px;font-variant-numeric:tabular-nums}
  /* stage centré verticalement dans l'écran ; « en attente » est posé au-dessus sans le décaler */
  #main{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0}
  #wait{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(50% + var(--sz)/2 + 14px);
    width:max-content;max-width:min(92vw,420px);text-align:center;justify-content:center;font-size:14px;padding:6px 12px;font-weight:600;line-height:1.3;border-radius:22px}
  #big.num{font-size:clamp(60px,calc(var(--sz)*.45),120px);line-height:1}
  #big.msg{font-size:clamp(20px,calc(var(--sz)/10),30px);line-height:1.15}
  #big.clock{font-size:clamp(32px,calc(var(--sz)/6),54px);line-height:1.1;font-variant-numeric:tabular-nums}
  #pass{position:absolute;left:50%;top:calc(50% + var(--sz)/2 + 14px);transform:translateX(-50%);z-index:3;font-size:15px;padding:8px 18px;white-space:nowrap}
  /* le stage est un carré */
  #stage{width:var(--sz);aspect-ratio:1/1;padding:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    transition:transform .12s}
  #stage.tap{cursor:pointer}
  #stage.tap:active{transform:scale(.985)}
  #big{font-size:clamp(26px,calc(var(--sz)/7),44px);font-weight:800;letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
  #sub{font-size:clamp(15px,calc(var(--sz)/16),19px);margin-top:10px;color:inherit;opacity:.8;font-weight:500}
  /* le nom est à mi-chemin entre le bas du stage et le bas de l'écran : 75% + (taille du stage)/4 */
  #foot{position:absolute;left:50%;top:calc(75% + var(--sz)/4);transform:translate(-50%,-50%);z-index:3;text-align:center}
  /* le nom prend la couleur du joueur, le texte s'adapte pour rester lisible */
  #myname{font-size:19px;font-weight:700;padding:10px 20px;user-select:none;-webkit-user-select:none;cursor:pointer;
    background:var(--pc,rgba(255,255,255,.55));color:var(--pt,var(--ink))}
  #myname .rw{display:none;align-items:center;gap:8px}
  #myname.armed{background:rgba(27,34,51,.9);color:#fff;border-color:rgba(255,255,255,.3)}
  #myname.armed .nm{display:none}
  #myname.armed .rw{display:inline-flex}
  #myname .rw svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
    animation:ccw 1.6s linear infinite}
  #myname.spin .rw svg{animation-duration:.45s}
  @keyframes ccw{to{transform:rotate(-360deg)}}
  #myname.shake{animation:shake .32s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #tapc{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));z-index:4;font-size:16px;font-weight:700;pointer-events:none;
    padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid #fff;box-shadow:0 6px 20px rgba(40,60,110,.18)}
  #tapc:empty{display:none}
  #end{position:fixed;right:12px;bottom:max(10px,env(safe-area-inset-bottom));z-index:5;
    font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;color:#d93025}
  #snd{position:fixed;left:12px;bottom:max(10px,env(safe-area-inset-bottom));z-index:5;
    font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--ink2)}

  /* modales : messages (#modal) et fiches (#sheet : chronos, choix du 1er joueur, stats) */
  #modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(27,34,51,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #modal.on{display:flex}
  #modal.stack .mbtns{flex-direction:column}     /* Annuler au-dessus, bouton principal en pleine largeur */
  .mbox{width:min(100%,360px);padding:24px;text-align:center;background:rgba(255,255,255,.82)}
  #mtext{font-size:17px;line-height:1.4;white-space:pre-line;word-break:break-word;margin-bottom:20px}
  .mbtns{display:flex;gap:10px;justify-content:center}
  .mbtns button{flex:1;padding:12px 16px}
  .sbox .mbtns button{flex:0 0 auto}      /* boutons des fiches : largeur du texte */
  #sheet{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(27,34,51,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #sheet.on{display:flex}
  .sbox{width:min(100%,460px);max-height:88vh;overflow:auto;padding:22px;background:rgba(255,255,255,.9);display:flex;flex-direction:column;gap:14px}
  .sh-title{font-size:22px;font-weight:700;text-align:center}
  .sh-sub{font-size:14px;color:var(--ink2);text-align:center;line-height:1.4}
  table.stt{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
  .stt th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);text-align:left;padding:4px 6px;font-weight:700}
  .stt td{padding:9px 6px;border-top:1px solid rgba(27,34,51,.08)}
  .stt tr.tot td{font-weight:700}
  .stt.ctr th,.stt.ctr td{text-align:center;vertical-align:middle;white-space:nowrap}
  .sh-game{font-size:32px;font-weight:800;text-align:center;letter-spacing:-.02em;line-height:1.1;word-break:break-word}
  /* panneau de fin : défilement horizontal, première colonne (prénoms) figée */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tscroll .stt.ctr{border-collapse:separate;border-spacing:0}
  .tscroll .stt.ctr th:first-child,.tscroll .stt.ctr td:first-child{position:sticky;left:0;z-index:2;background:#f7f9fd;box-shadow:2px 0 4px -2px rgba(27,34,51,.2)}
  .tscroll .npill{max-width:120px}
  .dot2{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;border:1px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);vertical-align:-1px}
  #rwfx{position:fixed;z-index:50;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(27,34,51,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;
    font-size:28px;font-weight:700;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
  #rwfx.on{opacity:1}
  #rwfx svg{width:130px;height:130px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:ccw .8s linear infinite}
  #rwtxt{font-size:19px;font-weight:500;opacity:.9}
  /* Time out : fond noir, texte blanc, sablier */
  #tofx{position:fixed;z-index:95;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#000;color:#fff;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
  #tofx.on{opacity:1;pointer-events:auto}
  #tofx svg{width:130px;height:130px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:flip 1.5s ease-in-out infinite}
  @keyframes flip{0%,35%{transform:rotate(0)}65%,100%{transform:rotate(180deg)}}
  #totitle{font-size:40px;font-weight:800;letter-spacing:.02em}
  #totxt{font-size:20px;font-weight:500;opacity:.9}

  /* clignotements : la couleur du joueur alterne avec une version pâle */
  .flash{animation:blink 1s steps(1) 3}
  @keyframes blink{0%{filter:none}50%{filter:brightness(1.8) saturate(.35)}100%{filter:none}}
  /* couleur très claire (blanc) : on alterne avec un gris clair, la version « pâle » ne se verrait pas */
  .lt.flash{animation-name:blinkL}
  .lt.slow,.lt.fast{animation-name:alarmL}
  @keyframes blinkL{0%{filter:none}50%{filter:brightness(.8)}100%{filter:none}}
  @keyframes alarmL{0%{filter:none}50%{filter:brightness(.8)}100%{filter:none}}
  .slow{animation:alarmblink 1s steps(1) infinite}
  .fast{animation:alarmblink .4s steps(1) infinite}
  @keyframes alarmblink{0%{filter:none}50%{filter:brightness(1.8) saturate(.35)}100%{filter:none}}
  /* recherche Myludo : résultats et extensions */
  .mlres{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
  .mlres button.mlit{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:8px 12px;border-radius:16px;font-size:16px}
  .mlres img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff;flex:0 0 48px}
  .mlres .mlt{flex:1;min-width:0;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .mlres .mlt small{display:block;font-weight:400;color:var(--ink2);font-size:13px}
  .mlres label.opt{padding:8px 4px;align-items:center}
  .mlres label.opt input{margin:0}
</style>
</head>
<body>

<!-- ACCUEIL -->
<div id="home" class="screen on">
  <div class="wrap">
    <h1>C'est à qui de jouer ?</h1>
    <div class="glass card">
      <label class="lab" for="code">Nom du jeu</label>
      <div class="acwrap">
        <input id="code" type="text" placeholder="ex. Catan" autocomplete="off">
        <div id="gsugg" class="sugg"></div>
      </div>
      <div class="row" id="mlRow" style="display:none;margin:12px 0 0;justify-content:flex-start"><button id="mlSearch" type="button" class="sm">Chercher sur Myludo</button></div>
      <div class="hint" id="mlPick" style="display:none"></div>
      <label class="opt" style="padding:12px 0 0;font-weight:500"><input type="checkbox" id="gext"><span>avec extension</span></label>
      <div class="row" id="extRow" style="display:none;margin:0;padding-left:40px"><span class="hint" id="extSum" style="margin:0;flex:1;text-align:left"></span><button id="extEdit" type="button" class="link">Modifier</button></div>
      <div class="row" style="margin-top:16px"><button id="go" class="pri" disabled>En attente</button></div>
      <div class="err" id="homeErr"></div>
    </div>
  </div>
</div>

<!-- PRÉPARATION -->
<div id="lobby" class="screen">
  <div class="wrap">
    <div class="codeval" id="lobbyCode"></div>
    <div class="hint ctr" id="lobbyExt" style="margin:0 0 6px"></div>

    <!-- joueur : écran 1 -->
    <div class="glass card" id="pickCard" style="display:none">

const PALETTE = ['#e53935','#fb8c00','#fdd835','#43a047','#4fc3f7','#4169e1','#8e24aa','#f06292','#795548','#9e9e9e','#111111','#ffffff'];

/* ---------- Sons (Web Audio : aucun fichier) ---------- */

function unlockAudio(){
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, {passive: true}));
function tone(f, t0, d, type, vol, f2){
  const t = actx.currentTime + t0, o = actx.createOscillator(), gn = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.02);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(gn); gn.connect(actx.destination);
  o.start(t); o.stop(t + d + 0.05);
}
// kind : 'turn' (c'est mon tour), 'alarm' (mon time out démarre), 'rewind', 'timeout' (tour passé)
function sound(kind){
  if (!sndOn || !actx || actx.state !== 'running') return;

/* ---------- Messages en modale (remplacent alert / confirm) ---------- */
function uiModal(msg, confirmMode, okLabel, cancelLabel, stack){

      resolve(v);
    };
    $('mok').onclick = () => done(true);
    $('mcancel').onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
  });
}
const uiAlert = msg => uiModal(msg, false);
const uiConfirm = (msg, okLabel) => uiModal(msg, true, okLabel);

/* ---------- Fiches (chronos, choix du 1er joueur, stats) ---------- */

function show(id){

  $('logout').style.display = id === 'home' ? 'none' : '';

}
// Déconnexion : libère mon joueur, oublie la table sur cet appareil et revient à l'accueil
$('logout').onclick = async () => {
  if (!await uiModal('Oublier ta session sur cet appareil et quitter la table ?', true, '(╯°□°)╯︵ ┻━┻', 'Annuler', true)) return;
  const r = ref, i = meIdx;
  if (r && i !== null && modeOf() !== 'solo' && modeOf() !== 'ia') r.child('claims/' + i).remove().catch(() => {});
  leaveGame();
};
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function isLight(hex){
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 225;
}
function textOn(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*gg + 0.114*b) > 150 ? '#111' : '#fff';
}
function hslHex(h, s, l){
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * c).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}
const players = () => (g && g.players) || [];
const modeOf = x => { x = x === undefined ? g : x; return (x && x.options && x.options.mode) || 'seq'; };
const norm = s => String(s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// première couleur encore libre (palette d'abord, puis couleurs générées)
function freeColorFrom(list){
  const used = list.map(p => String(p.color).toLowerCase());
  for (const c of PALETTE) if (!used.includes(c)) return c;
  for (let h = 15, i = 0; i < 360; i++, h = (h + 47) % 360){
    const c = hslHex(h, 70, 50);
    if (!used.includes(c)) return c;
  }
  return '#888888';
}
const freeColor = () => freeColorFrom(players());

// quel joueur ce téléphone a-t-il choisi ?
function myIdx(){
  const c = (g && g.claims) || {};
  for (const k in c) if (c[k] === dev) return +k;

}

  let k = 0;
  for (let i = 0; i < n; i++) if (c[i] != null) k++;
  return k;
}

/* ---------- Chronos ---------- */
function fmt(ms){
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = v => String(v).padStart(2, '0');
  return (h ? h + ':' + p(m) : p(m)) + ':' + p(x);
}
function elapsed(i, v){
  v = v || g;
  const tm = (v && v.tm) || {};
  const a = (tm.acc || {})[i] || 0, r = (tm.run || {})[i];
  return a + (r != null ? Math.max(0, nowS() - r) : 0);
}
function totalMs(v){
  v = v || g;
  const tm = (v && v.tm) || {};
  return (tm.totAcc || 0) + (tm.totRun != null ? Math.max(0, nowS() - tm.totRun) : 0);
}

/* ============================================================
   Moteur de partie : fonctions appliquées DANS les transactions
   (elles modifient l'objet « cur » = toute la partie)
   ============================================================ */

// Qui est chronométré ? Seuls les joueurs « en train de jouer » (le joueur actif, ou en simultané
// tous ceux qui n'ont pas fini). Pause pendant le choix du 1er joueur.
function applyTiming(cur, now){
  const n = (cur.players || []).length;
  const tm = cur.tm = cur.tm || {};
  tm.acc = tm.acc || {}; tm.run = tm.run || {};
  const should = {};
  if (cur.go && !cur.ended && !cur.reorder){
    if (modeOf(cur) === 'sim'){
      for (let i = 0; i < n; i++) if (!(cur.done && cur.done[i])) should[i] = 1;
    } else should[cur.current % n] = 1;
  }
  for (const k in tm.run){
    if (tm.run[k] == null) continue;
    if (!should[k]){ tm.acc[k] = (tm.acc[k] || 0) + now - tm.run[k]; tm.run[k] = null; }
  }
  for (const k in should) if (tm.run[k] == null) tm.run[k] = now;
  // chrono total de la partie
  if (cur.go && !cur.ended){ if (tm.totRun == null) tm.totRun = now; }
  else if (tm.totRun != null){ tm.totAcc = (tm.totAcc || 0) + now - tm.totRun; tm.totRun = null; }
}

// passage au joueur suivant. kind : 'play' (j'ai fini), 'pass' (je passe la manche), 'skip' (tour passé par « Plus vite »)
function advance(cur, kind, now){
  const n = cur.players.length, c = cur.current % n, o = cur.options || {};
  const log = cur.log || []; log.push({p: c, a: kind, cy: cur.cycle || 1}); cur.log = log;
  cur.turn = (cur.turn || 1) + 1;
  cur.alarm = null; cur.hurry = null;
  if (kind === 'pass'){ cur.passed = cur.passed || {}; cur.passed[c] = true; }
  let next = null, end = false;
  if (o.rounds){
    for (let s = 1; s <= n; s++){ const j = (c + s) % n; if (!(cur.passed && cur.passed[j])){ next = j; break; } }
    if (next === null) end = true;                           // tout le monde a passé : fin de manche
  } else {
    next = (c + 1) % n;
    if (next === 0) end = true;                              // tout le monde a joué : fin de manche
  }
  if (end){
    cur.round = (cur.round || 1) + 1;
    cur.cycle = 1;                                           // nouvelle manche : le compteur de tours repart de 1
    if (o.rounds || o.rotate) cur.log = null;
    cur.passed = null;
    cur.current = 0;
    if (o.rotate) cur.reorder = {round: cur.round};          // choix du 1er joueur, chronos en pause
  } else {
    // par manche : « Tour » + 1 quand on revient au premier joueur encore en jeu (même s'il n'est pas le joueur n°1)
    if (o.rounds && next <= c) cur.cycle = (cur.cycle || 1) + 1;
    cur.current = next;
  }
  cur.ts = now;                                              // le compte à rebours repart
  applyTiming(cur, now);
}

// simultané : le joueur i a fini
function finishSim(cur, i, now){
  const n = cur.players.length;
  cur.done = cur.done || {}; cur.done[i] = true;
  cur.alarm = null; cur.hurry = null;
  const left = [];
  for (let k = 0; k < n; k++) if (!cur.done[k]) left.push(k);
  const o = cur.options || {};
  if (!left.length){
    cur.round = (cur.round || 1) + 1; cur.turn = (cur.turn || 1) + 1; cur.done = null;   // nouvelle manche
    cur.ts = now; cur.cdm = null;                            // le compte à rebours repart
    if (o.rotate) cur.reorder = {round: cur.round};
  } else {
    // compte à rebours manuel : le 1er joueur qui a fini le lance pour tous les autres
    if (o.cdm && !cur.cdm) cur.cdm = {t: now};
    if (left.length === 1 && o.hurry && !o.cdm){
      // « Time out » automatique sur le dernier joueur
      cur.alarm = {player: left[0], turn: cur.turn, until: now + 30000};
      cur.st = cur.st || {}; cur.st.hurry = cur.st.hurry || {};
      cur.st.hurry[left[0]] = (cur.st.hurry[left[0]] || 0) + 1;
    }
  }
  applyTiming(cur, now);
}

// réorganisation des joueurs : toutes les données indexées par joueur suivent
function remapMap(m, perm){
  if (!m) return null;
  const o = {}; let any = false;
  perm.forEach((old, nw) => { if (m[old] != null){ o[nw] = m[old]; any = true; } });
  return any ? o : null;
}
function applyReorder(cur, perm, now){
  cur.players = perm.map(o => cur.players[o]);
  ['claims', 'rw', 'passed', 'done', 'hurry'].forEach(k => { cur[k] = remapMap(cur[k], perm); });
  const tm = cur.tm = cur.tm || {};
  tm.acc = remapMap(tm.acc, perm) || {}; tm.run = remapMap(tm.run, perm) || {};
  if (cur.st) cur.st.hurry = remapMap(cur.st.hurry, perm);
  cur.current = 0; cur.reorder = null; cur.log = null; cur.passed = null; cur.alarm = null; cur.skipped = null;
  cur.ts = now; cur.cdm = null;
  applyTiming(cur, now);
}

/* ---------- Accueil ---------- */
// clé en base à partir du nom du jeu (sans accents, majuscules, lettres/chiffres)
const keyOf = s => String(s).trim().normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9_-]/g, '');

function join(c){
  const gameName = c.trim();
  code = keyOf(gameName);
  if (!code){ $('code').classList.add('bad'); return; }      // champ vide : bordure rouge, sans texte
  localStorage.setItem('tour_code', code);
  $('homeErr').textContent = '';
  meIdx = null;
  hadData = false; creating = false; fxInit = false; lastFx = null; lastWaiting = false; proceeded = false;
  statsOpen = false; reorderOpen = false; adding = false; optsShown = false; lastTo = null;
  if (ref && gameCb) ref.off('value', gameCb);
  ref = db.ref('games/' + code);
  gameCb = snap => {
    const v = snap.val();
    if (v && v.ended){
      // la partie a été terminée : chacun voit les statistiques, puis revient à l'accueil
      if (hadData){ g = v; $('modal').classList.remove('on'); $('rwfx').classList.remove('on'); $('tofx').classList.remove('on'); disarm(); showStats(v); }
      else ref.remove();                 // reste d'une ancienne partie : on nettoie
      return;
    }
    if (!v){
      if (statsOpen) return;
      if (hadData){ leaveGame(); return; }          // la partie a été supprimée
      if (isAdmin()){
        // l'administrateur crée la table, puis la signale aux autres téléphones
        if (!creating){
          creating = true;
          const ext = !!$('gext').checked, key = code;
          const mg = mlGame ? mlItem(mlGame) : null, mx = ext ? mlExts.map(mlItem) : [];
          ref.update({name: gameName, ext: ext, myludo: mg, exts: mx.length ? mx : null, current: 0, turn: 1, round: 1, started: false, options: {rewind: true, hurry: true, mode: 'seq'}})
            .then(() => {
              db.ref('lobby').set({code: key, name: gameName, ext: ext, t: firebase.database.ServerValue.TIMESTAMP}).catch(() => {});
              // le nom du jeu est mémorisé (autocomplétion quand on rejoue)
              db.ref('catalog/' + key).transaction(x => { x = x || {plays: 0}; x.name = gameName; x.ext = ext; x.plays = (x.plays || 0) + 1; if (mg) x.myludo = mg; if (mx.length) x.exts = mx; return x; }).catch(() => {});
            })
            .catch(e => { const m = e.message; leaveGame(); $('homeErr').textContent = 'Erreur : ' + m; });
        }
        return;
      }
      const tried = code;
      leaveGame();
      $('code').value = tried;
      $('homeErr').textContent = "Cette partie n'existe pas. Seul l'administrateur peut créer une table.";
      return;
    }
    hadData = true;
    // animation Rewind : jouée sur tous les écrans quand un nouveau rewind est lancé
    const fx = v.rwFx ? v.rwFx.id : null, tx = v.toFx ? v.toFx.id : null;
    if (!fxInit){ fxInit = true; lastFx = fx; lastTo = tx; }
    else {
      if (fx && fx !== lastFx){
        lastFx = fx;
        const pl = (v.players || [])[v.rwFx.by];
        playRewind(pl ? pl.name : '');
      }
      // Time out : le joueur pénalisé voit son tour passé, tout le monde le voit sur fond noir
      if (tx && tx !== lastTo){
        lastTo = tx;
        const by = v.toFx.by, pl = (v.players || [])[by];
        playTimeout(pl ? pl.name : '', (v.claims || {})[by] === dev, modeOf(v) === 'sim', !!v.toFx.all);
      }
    }
    g = v;
    render();
  };
  ref.on('value', gameCb, err => { $('homeErr').textContent = 'Erreur Firebase : ' + err.message; show('home'); });
}
let creating = false, fxInit = false, lastFx = null, lastWaiting = false, waiting = false, fxTimer = null;

/* ---------- Recherche Myludo (jeux de base, puis extensions) via le relais ---------- */
// fiche réduite à ce qu'on enregistre en base (aucune valeur « undefined » : Firebase la refuse)
function mlItem(x){
  x = x || {};
  return {id: String(x.id || ''), title: String(x.title || ''), subtitle: String(x.subtitle || ''),
          edition: Number(x.edition) || 0, image: typeof x.image === 'string' ? x.image : ''};
}
// nom court d'une extension : on retire le nom du jeu en début de titre (« Terraforming Mars - Prelude 2 » -> « Prelude 2 »)
function shortExt(x, base){
  let t = x.title || '';
  if (base && norm(t).startsWith(norm(base))){
    const r = t.slice(base.length).replace(/^[\s\-–—:·]+/, '');
    if (r) t = r;
  }
  return t + (x.subtitle ? ' - ' + x.subtitle : '');
}
// affichage des éléments liés à Myludo sur la page d'accueil (admin uniquement)
function syncMl(){
  const adm = isAdmin();
  $('mlRow').style.display = adm && MYLUDO_RELAY ? '' : 'none';
  const pk = $('mlPick');
  if (adm && mlGame){
    pk.style.display = '';
    pk.textContent = 'Fiche Myludo : ' + mlGame.title + (mlGame.subtitle ? ' - ' + mlGame.subtitle : '') + (mlGame.edition ? ' (' + mlGame.edition + ')' : '');
  } else pk.style.display = 'none';
  $('extRow').style.display = adm && $('gext').checked && MYLUDO_RELAY ? '' : 'none';
  $('extSum').textContent = mlExts.length ? mlExts.map(x => shortExt(x, mlGame && mlGame.title)).join(', ') : 'Aucune extension choisie';
}
async function mlFetch(params){
  if (!MYLUDO_RELAY) throw new Error('Relais Myludo non configuré.');
  const u = firebase.auth().currentUser;
  if (!u) throw new Error('Connecte-toi en administrateur.');
  const tok = await u.getIdToken();
  const r = await fetch(MYLUDO_RELAY.replace(/\/$/, '') + '/search?' + new URLSearchParams(params), {headers: {Authorization: 'Bearer ' + tok}});
  if (!r.ok){
    let why = '';
    try { why = (await r.json()).why || ''; } catch (e) {}
    throw new Error('Relais Myludo : erreur ' + r.status + (why ? ' (' + why + ')' : ''));
  }
  return r.json();
}
// toutes les pages d'une recherche (18 résultats par page), sans doublon
async function mlAll(q, filter, lang){
  const out = [], seen = new Set();
  let count = 0;
  for (let page = 1; page <= 6; page++){
    const d = await mlFetch({q, filter, lang, page});
    count = d.count || 0;
    if (!d.list || !d.list.length) break;
    d.list.forEach(it => { if (!seen.has(it.id)){ seen.add(it.id); out.push(mlItem(it)); } });
    if (out.length >= count) break;
  }
  return out;
}
function mlEmpty(box, msg, err){ box.innerHTML = '<div class="hint"' + (err ? ' style="color:#d93025"' : '') + '>' + esc(msg) + '</div>'; }
function mlImg(it){
  return it.image && it.image.startsWith('https://www.myludo.fr/')
    ? '<img src="' + esc(it.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
    : '<span style="flex:0 0 48px;width:48px"></span>';
}
const mlTitle = it => esc(it.title) + (it.subtitle ? '<small>' + esc(it.subtitle) + '</small>' : '');

// 1) choix du jeu
let mlSeq = 0, mlCache = [], mlTimer = null;
function openGameSearch(){
  setSheet('<div class="sh-title">Chercher sur Myludo</div>' +
    '<input id="mlq" type="text" placeholder="Nom du jeu" maxlength="80" autocomplete="off" value="' + esc($('code').value.trim()) + '">' +
    '<label class="opt" style="padding:0"><input type="checkbox" id="mlfr" checked><span>Français uniquement</span></label>' +
    '<div id="mlres" class="mlres"></div>', 'Fermer', null, true);
  const inp = $('mlq'), box = $('mlres');
  inp.oninput = () => { clearTimeout(mlTimer); mlTimer = setTimeout(runGameSearch, 450); };
  inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(mlTimer); runGameSearch(); } };
  $('mlfr').onchange = runGameSearch;
  box.onclick = e => { const b = e.target.closest('button[data-i]'); if (b && mlCache[+b.dataset.i]) pickMlGame(mlCache[+b.dataset.i]); };

async function runGameSearch(){
  const inp = $('mlq'), box = $('mlres');
  if (!inp || !box) return;
  const q = inp.value.trim(), n = ++mlSeq;
  if (q.length < 2){ mlEmpty(box, 'Tape au moins 2 lettres.'); return; }
  mlEmpty(box, 'Recherche…');
  try {
    const list = await mlAll(q, 'basegame', $('mlfr').checked ? 'fr' : '');
    if (n !== mlSeq || !$('mlres')) return;
    mlCache = list;
    box.innerHTML = list.length
      ? list.map((it, i) => '<button type="button" class="mlit" data-i="' + i + '">' + mlImg(it) + '<span class="mlt">' + mlTitle(it) + '</span><span>' + (it.edition || '') + '</span></button>').join('')
      : '<div class="hint">Aucun résultat.</div>';
  } catch (e) { if (n === mlSeq && $('mlres')) mlEmpty(box, e.message, true); }
}
function pickMlGame(it){
  mlGame = mlItem(it);
  $('code').value = it.title + (it.subtitle ? ' - ' + it.subtitle : '');
  mlLabel = $('code').value.trim();
  $('code').classList.remove('bad'); $('homeErr').textContent = '';

  const k = catalog[keyOf($('code').value)];
  mlExts = k && k.exts ? (Array.isArray(k.exts) ? k.exts : Object.values(k.exts)).map(mlItem) : [];
  if (k && k.ext) $('gext').checked = true;
  closeSheet(); syncMl();
  if ($('gext').checked) openExtSearch();
}

// 2) choix des extensions (cases à cocher)
let extSel = new Map(), extCand = [], extSeq = 0, extBase = '';
function openExtSearch(){
  extBase = (mlGame && mlGame.title) || $('code').value.trim();
  if (extBase.length < 2){ uiAlert("Choisis d'abord le jeu."); $('gext').checked = false; syncMl(); return; }
  extSel = new Map(mlExts.map(x => [x.id, x]));
  extCand = [];
  setSheet('<div class="sh-title">Extensions</div><div class="sh-sub">' + esc(extBase) + '</div>' +
    '<input id="exq" type="text" placeholder="Filtrer la liste" autocomplete="off">' +
    '<label class="opt" style="padding:0"><input type="checkbox" id="exfr" checked><span>Français uniquement</span></label>' +
    '<div id="exres" class="mlres"></div>', 'Valider', commitExt, true);
  $('exq').oninput = drawExt;
  $('exfr').onchange = loadExt;
  $('exres').onchange = e => {
    const c = e.target.closest('input[data-id]');
    if (!c) return;
    const it = extCand.find(x => x.id === c.dataset.id) || extSel.get(c.dataset.id);
    if (c.checked && it) extSel.set(c.dataset.id, it); else extSel.delete(c.dataset.id);
  };
  loadExt();
}
async function loadExt(){
  const n = ++extSeq, box = $('exres');
  if (!box) return;
  mlEmpty(box, 'Recherche…');
  try {
    const list = await mlAll(extBase, 'extension', $('exfr').checked ? 'fr' : '');
    if (n !== extSeq || !$('exres')) return;
    extCand = list; drawExt();
  } catch (e) { if (n === extSeq && $('exres')) mlEmpty(box, e.message, true); }
}
function drawExt(){
  const box = $('exres');
  if (!box) return;
  const f = norm($('exq').value), seen = new Set();
  // les extensions déjà choisies restent visibles même si le filtre de langue ne les retrouve pas
  const all = extCand.concat([...extSel.values()].filter(x => !extCand.some(c => c.id === x.id)));
  const rows = all.filter(it => !seen.has(it.id) && seen.add(it.id) && (!f || norm(it.title + ' ' + it.subtitle).includes(f)));
  box.innerHTML = rows.length
    ? rows.map(it => '<label class="opt"><input type="checkbox" data-id="' + esc(it.id) + '"' + (extSel.has(it.id) ? ' checked' : '') + '>' +
        mlImg(it) + '<span class="mlt">' + mlTitle(it) + '</span><span>' + (it.edition || '') + '</span></label>').join('')
    : '<div class="hint">Aucune extension trouvée.</div>';
}
function commitExt(){ mlExts = [...extSel.values()]; closeSheet(); syncMl(); }

let gList = [], gIdx = -1;
function hideG(){ gList = []; gIdx = -1; $('gsugg').classList.remove('on'); $('gsugg').innerHTML = ''; }
function markG(scroll){
  const kids = [...$('gsugg').children];
  kids.forEach((b, i) => b.classList.toggle('act', i === gIdx));
  const a = kids[gIdx];
  if (scroll && a && a.scrollIntoView) a.scrollIntoView({block: 'nearest'});
}
function pickG(c){
  $('code').value = c.name || '';
  $('gext').checked = !!c.ext;               // jeu connu : on reprend l'option « extension »
  $('code').classList.remove('bad'); $('homeErr').textContent = '';

  syncMl();
  hideG();
}
function showG(){
  const v = norm($('code').value);
  if (!isAdmin() || !v){ hideG(); return; }
  const m = Object.keys(catalog).map(k => catalog[k]).filter(x => x && x.name && norm(x.name).includes(v) && norm(x.name) !== v)
    .sort((a, b) => (norm(b.name).startsWith(v) ? 1 : 0) - (norm(a.name).startsWith(v) ? 1 : 0)).slice(0, 6);
  if (!m.length){ hideG(); return; }
  gList = m; gIdx = -1;
  const box = $('gsugg'); box.innerHTML = '';
  m.forEach(c => {
    const b = document.createElement('button');

$('code').addEventListener('input', showG);

$('code').addEventListener('keydown', e => {
  const open = gList.length > 0;
  if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    e.preventDefault();
    const n = gList.length;
    gIdx = e.key === 'ArrowDown' ? (gIdx + 1) % n : (gIdx <= 0 ? n - 1 : gIdx - 1);
    markG(true);
    return;
  }
  if (e.key === 'Escape' && open){ e.preventDefault(); hideG(); return; }
  if (e.key === 'Enter'){
    e.preventDefault();
    if (open && gIdx >= 0){ pickG(gList[gIdx]); return; }     // suggestion choisie dans la liste
    hideG();
    if (!$('go').disabled) join($('code').value);              // sinon Entrée valide le formulaire
  }
});

/* ---------- Rendu global ---------- */
function render(){
  if (!g.started) return renderLobby();
  const mode = modeOf(), n = players().length;
  meIdx = myIdx();
  if (mode === 'solo' || mode === 'ia'){
    // un seul téléphone joue tous les joueurs : on incarne celui dont c'est le tour
    if (meIdx === null) return renderLobby();
    meIdx = g.current % n;
  } else {
    if (meIdx === null && !proceeded) return renderLobby();   // pas encore « Rejoindre »
    if (meIdx === null || meIdx >= n) return renderWho();
  }
  renderGame();
}

/* ---------- Préparation ---------- */
const HURRY_SEQ = 'Time out<br><small>Si tous les autres tapotent 10 fois en 10 s, le joueur actif clignote 30 s puis son tour est passé.</small>';
const HURRY_SIM = 'Time out au dernier joueur<br><small>Quand il ne reste qu\'un joueur, il clignote 30 s puis le tour se termine.</small>';
const ROUNDS_SEQ = 'Jeu par manche<br><small>Bouton "Passer son tour" : la manche se termine pour ce joueur, les autres jouent jusqu\'à ce que tout le monde ait passé.</small>';
const ROUNDS_SIM = 'Jeu par manche<br><small>Les parties sont comptées en manches : une manche se termine quand tout le monde a fini.</small>';

// « 1 » dans le dot du 1er joueur ; prénom dans une pilule à la couleur du joueur
function dotHtml(p, first){
  return `<div class="dot" style="background:${esc(p.color)};color:${textOn(p.color)}">${first ? '1' : ''}</div>`;
}
function pill(p){
  return `<span class="npill" style="background:${esc(p.color)};color:${textOn(p.color)}">${esc(p.name)}</span>`;
}

function renderLobby(){
  show('lobby');
  $('lobbyCode').textContent = g.name || code;
  const gx = Array.isArray(g.exts) ? g.exts : Object.values(g.exts || {});
  $('lobbyExt').textContent = !g.ext ? '' : (gx.length ? 'avec ' + gx.map(x => shortExt(x, g.myludo && g.myludo.title)).join(', ') : 'avec extension');
  const adm = isAdmin(), mode = modeOf(), o = g.options || {}, started = !!g.started;
  const seqIa = mode === 'seq' || mode === 'ia', sim = mode === 'sim';
  const showFirst = seqIa || (sim && !!o.rotate);
  const list = players(), box = $('plist'), claims = g.claims || {}, myI = myIdx();
  const canPick = !adm && !started && (mode === 'seq' || sim);     // joueur : choisir / ajouter mon prénom
  if (!canPick) adding = false;
  box.innerHTML = '';
  if (!list.length){
    box.innerHTML = '<div class="hint" style="margin:0">Aucun joueur pour l\'instant.</div>';
  }
  list.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'pl';
    d.innerHTML = dotHtml(p, i === 0 && showFirst) + `<div class="nm">${i+1}. ${esc(p.name)}</div>` +
      (adm && !started && claims[i] != null ? '<span class="tag">pris</span>' : '');
    const up = document.createElement('button'); up.textContent = '↑'; up.disabled = i === 0;
    up.onclick = () => move(i, -1, p.name);
    const dn = document.createElement('button'); dn.textContent = '↓'; dn.disabled = i === list.length - 1;
    dn.onclick = () => move(i, 1, p.name);
    const rm = document.createElement('button'); rm.textContent = '✕';
    rm.onclick = () => removePlayer(i, p.name);
    // étoile vide / pleine : enregistre le prénom et la couleur en favoris
    const star = document.createElement('button'); star.className = 'star';
    const isFav = !!favs[slug(p.name)];
    star.textContent = isFav ? '★' : '☆';
    star.title = isFav ? 'Favori' : 'Ajouter aux favoris';
    star.onclick = () => toggleFav(p);
    d.append(star);
    if (adm && !started) d.append(up, dn);                               // seul l'admin change l'ordre
    if (!started && (adm || claims[i] === dev)) d.append(rm);            // un joueur ne retire que le sien
    box.append(d);
  });

  // ----- interface joueur : « Choisir un joueur » (clic = sélection) / « Ajouter un joueur »
  $('pickCard').style.display = canPick && !adding ? '' : 'none';
  $('pickRow').style.display = canPick && !adding ? '' : 'none';
  $('addCard').style.display = adm ? (started ? 'none' : '') : (canPick && adding ? '' : 'none');
  $('addCancel').style.display = adm ? 'none' : '';
  $('ordCard').style.display = adm ? '' : 'none';
  const pk = $('pickList'); pk.innerHTML = '';
  if (canPick){
    if (!list.length) pk.innerHTML = '<div class="hint" style="margin:0 0 12px">Aucun joueur pour l\'instant : ajoute le tien.</div>';
    list.forEach((p, i) => {
      const taken = claims[i] != null && claims[i] !== dev, mineSel = claims[i] === dev;
      const b = document.createElement('button'); b.className = 'claimbtn' + (mineSel ? ' sel' : '');
      b.innerHTML = '<span>' + esc(p.name) + '</span>' + (taken ? '<small>déjà pris</small>' : (mineSel ? '<small>c\'est moi</small>' : ''));
      b.disabled = taken;
      b.style.background = p.color; b.style.color = textOn(p.color);
      b.onclick = () => claim(i);
      pk.append(b);
    });
  }

  // ----- mode de jeu et options : modifiables par l'admin, consultables par les joueurs à la demande
  const seeOpts = adm || optsShown;
  $('optToggleRow').style.display = adm ? 'none' : '';
  $('optToggle').textContent = optsShown ? 'Masquer le mode de jeu et les options' : 'Voir le mode de jeu et les options';
  $('modeCard').style.display = seeOpts ? '' : 'none';
  document.querySelectorAll('input[name=mode]').forEach(r => { r.checked = r.value === mode; r.disabled = !adm || started; });
  $('optHurry').checked = !!o.hurry;
  $('optRewind').checked = !!o.rewind;
  $('optRounds').checked = !!o.rounds;
  $('optRotate').checked = !!o.rotate;
  $('optCd').checked = !!o.cd;
  $('optCdm').checked = !!o.cdm;
  if (document.activeElement !== $('cdSecs')) $('cdSecs').value = o.cdSecs || 60;
  ['optHurry', 'optRewind', 'optRounds', 'optRotate', 'optCd', 'optCdm', 'cdSecs'].forEach(id => { $(id).disabled = !adm || started; });
  $('lblCdm').style.display = sim ? '' : 'none';                       // lancement manuel : simultané uniquement
  $('cdRow').style.display = (o.cd || (sim && o.cdm)) ? '' : 'none';
  $('lblRewind').style.display = seqIa ? '' : 'none';
  $('lblHurry').style.display = (mode === 'seq' || sim) ? '' : 'none';
  $('lblRounds').style.display = (seqIa || sim) ? '' : 'none';      // « par manche » et « changement de 1er joueur » aussi en simultané
  $('lblRotate').style.display = (seqIa || sim) ? '' : 'none';
  $('roundsTxt').innerHTML = sim ? ROUNDS_SIM : ROUNDS_SEQ;
  $('optCard').style.display = !seeOpts ? 'none' : '';
  $('hurryTxt').innerHTML = sim ? HURRY_SIM : HURRY_SEQ;
  $('rand').style.display = adm && !started && (mode === 'seq' || (sim && !!o.rotate)) ? '' : 'none';
  $('rand').disabled = list.length < 2;

  // admin : « Lancer la partie » ; joueurs : attente du lancement, puis « Rejoindre » si besoin
  const sb = $('start');
  let ok = true, hint = '';
  if (mode === 'solo'){ ok = list.length === 1; if (list.length > 1) hint = 'Solo : un seul joueur.'; }
  else if (mode === 'ia'){ ok = list.filter(p => !p.ai).length === 1; if (list.length > 1) hint = "Avec l'IA : un seul joueur (l'IA est ajoutée au lancement)."; }
  else ok = list.length >= 2;
  if (adm && !started){
    sb.style.display = '';
    sb.textContent = 'Lancer la partie'; sb.disabled = !ok; $('startHint').textContent = hint;
  } else if (started){
    sb.style.display = '';
    sb.textContent = 'Rejoindre'; sb.disabled = mode === 'solo' || mode === 'ia'; $('startHint').textContent = '';
  } else {
    sb.style.display = 'none';
    $('startHint').textContent = "En attente du lancement de la partie par l'administrateur.";
  }
  $('cancelLobby').style.display = started ? 'none' : '';

  // si la couleur proposée vient d'être prise (par moi ou un autre téléphone), on en propose une libre
  syncColor();
}

// modifie la liste des joueurs AVANT le lancement : les choix de prénom (claims) suivent les joueurs
function editPlayers(makePerm){
  ref.transaction(cur => {
    if (!cur || cur.started) return;
    const perm = makePerm(cur.players || []);
    if (!perm) return;
    applyReorder(cur, perm, nowS());
    return cur;
  });
}
function move(i, d, name){
  editPlayers(a => {
    const j = i + d;
    if (!a[i] || !a[j] || a[i].name !== name) return null;
    const perm = a.map((_, k) => k); perm[i] = j; perm[j] = i;
    return perm;
  });
}
function removePlayer(i, name){
  editPlayers(a => (a[i] && a[i].name === name) ? a.map((_, k) => k).filter(k => k !== i) : null);
}
// tire un joueur au hasard et le place en premier (les autres gardent leur ordre, à ajuster avec les flèches)
$('rand').onclick = () => {
  editPlayers(a => {
    if (a.length < 2) return null;
    const r = Math.floor(Math.random() * a.length);
    return [r].concat(a.map((_, k) => k).filter(k => k !== r));
  });
};
$('pickBtn').onclick = () => { adding = true; renderLobby(); };
$('addCancel').onclick = () => { adding = false; nameErr(''); hideSugg(); renderLobby(); };
$('optToggle').onclick = () => { optsShown = !optsShown; renderLobby(); };

function nameErr(msg){ $('nameErr').textContent = msg || ''; }
function addPlayer(){
  const name = $('pname').value.trim(), color = $('pcolor').value.toLowerCase();
  if (!name){ $('pname').classList.add('bad'); return; }     // prénom vide : bordure rouge, sans texte
  hideSugg();
  if (colorTaken(color)){ nameErr(''); $('pcolor').classList.add('bad'); return; }   // couleur prise : rond rouge, sans texte
  const mode = modeOf();
  let reason = '';
  // transaction : pas de doublon même si deux téléphones ajoutent en même temps
  ref.child('players').transaction(a => {
    a = a || [];
    reason = '';
    if (mode === 'solo' && a.length >= 1){ reason = 'Solo : un seul joueur.'; return; }
    if (mode === 'ia' && a.filter(p => !p.ai).length >= 1){ reason = "Un seul joueur contre l'IA."; return; }
    if (a.some(p => norm(p.name) === norm(name))){ reason = 'Ce prénom est déjà pris.'; return; }
    if (a.some(p => String(p.color).toLowerCase() === color)){ reason = 'Cette couleur est déjà prise.'; return; }
    a.push({name, color});
    return a;
  }, (err, committed, snap) => {
    if (err){ nameErr(err.code === 'PERMISSION_DENIED' || /permission/i.test(err.message) ? "Seul l'administrateur peut créer une partie." : 'Erreur : ' + err.message); return; }
    if (!committed){
      if (reason === 'Cette couleur est déjà prise.'){ nameErr(''); $('pcolor').classList.add('bad'); }
      else nameErr(reason || 'Impossible d\'ajouter ce joueur.');
      return;
    }
    nameErr('');
    $('pname').value = '';
    $('pcolor').value = freeColor(); syncColor();
    if (!isAdmin()){
      const arr = snap && snap.val(), idx = Array.isArray(arr) ? arr.findIndex(x => x && norm(x.name) === norm(name)) : -1;
      adding = false;
      if (idx >= 0) claim(idx);
      renderLobby();
    } else $('pname').focus();
  });
}
$('addP').onclick = addPlayer;
$('pname').addEventListener('keydown', e => {
  const open = suggList.length > 0;
  if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    e.preventDefault();
    const n = suggList.length;
    suggIdx = e.key === 'ArrowDown' ? (suggIdx + 1) % n : (suggIdx <= 0 ? n - 1 : suggIdx - 1);
    markSugg(true);
    return;
  }
  if (e.key === 'Escape' && open){ e.preventDefault(); hideSugg(); return; }
  if (e.key === 'Enter'){
    e.preventDefault();
    if (open && suggIdx >= 0){ pickSugg(suggList[suggIdx]); return; }   // suggestion choisie au clavier
    addPlayer();
  }
});
$('pname').addEventListener('input', () => { nameErr(''); $('pname').classList.remove('bad'); showSugg(); });
$('pcolor').addEventListener('input', () => { nameErr(''); syncColor(); });
$('moreColors').onclick = () => {

function colorTaken(c){ return players().some(p => String(p.color).toLowerCase() === String(c).toLowerCase()); }
// rond de couleur : bordure rouge si la couleur est déjà prise ; pastilles de la palette (prises = estompées)

/* ---------- Autocomplétion du prénom (favoris), à partir de 2 lettres ---------- */
let suggList = [], suggIdx = -1;
function hideSugg(){ suggList = []; suggIdx = -1; $('sugg').classList.remove('on'); $('sugg').innerHTML = ''; }
function markSugg(scroll){
  const kids = [...$('sugg').children];
  kids.forEach((b, i) => b.classList.toggle('act', i === suggIdx));
  const a = kids[suggIdx];
  if (scroll && a && a.scrollIntoView) a.scrollIntoView({block: 'nearest'});
}
function pickSugg(f){
  $('pname').value = f.name;
  const used = players().some(p => String(p.color).toLowerCase() === String(f.color).toLowerCase());
  $('pcolor').value = used ? freeColor() : f.color;      // sa couleur favorite, sauf si elle est déjà prise
  $('pname').classList.remove('bad');
  hideSugg(); nameErr(''); syncColor();
}
function showSugg(){
  const v = norm($('pname').value);
  if (v.length < 2){ hideSugg(); return; }
  const taken = players().map(p => norm(p.name));
  const m = Object.keys(favs).map(k => favs[k]).filter(f => f && f.name && norm(f.name).startsWith(v) && !taken.includes(norm(f.name))).slice(0, 5);
  if (!m.length){ hideSugg(); return; }
  suggList = m; suggIdx = -1;     // rien de sélectionné : Entrée valide le formulaire, sauf si on a choisi dans la liste (flèches)
  const box = $('sugg'); box.innerHTML = '';
  m.forEach(f => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="dot2" style="background:${esc(f.color)};margin:0"></span>${esc(f.name)}`;
    b.onpointerdown = e => { e.preventDefault(); pickSugg(f); };
    box.append(b);
  });
  box.classList.add('on');
  markSugg(false);
}
$('pname').addEventListener('blur', () => setTimeout(hideSugg, 150));

// lancement (admin) : prépare la partie selon le mode ; sinon « Rejoindre » une partie lancée
function launch(){
  proceeded = true;
  ref.transaction(cur => {
    if (!cur) return cur;
    if (cur.started) return;
    const mode = modeOf(cur);
    const pl = (cur.players || []).slice();
    if (mode === 'solo' && pl.length !== 1) return;
    if (mode === 'ia'){
      if (pl.filter(p => !p.ai).length !== 1) return;
      if (!pl.some(p => p.ai)) pl.push({name: 'IA', color: freeColorFrom(pl), ai: true});
    }
    if ((mode === 'seq' || mode === 'sim') && pl.length < 2) return;
    cur.players = pl;
    cur.started = true; cur.current = 0; cur.turn = 1; cur.round = 1; cur.cycle = 1;
    cur.log = null; cur.passed = null; cur.done = null; cur.st = null; cur.reorder = null; cur.alarm = null; cur.hurry = null; cur.skipped = null;
    cur.tm = {acc: {}, run: {}, totAcc: 0};
    cur.ts = nowS(); cur.cdm = null;
    if (mode === 'solo' || mode === 'ia'){
      cur.claims = {}; pl.forEach((p, i) => { cur.claims[i] = dev; });   // ce téléphone joue tous les joueurs
      cur.go = true;
    } else {
      // le chrono démarre quand tout le monde a choisi son prénom (certains l'ont peut-être déjà fait)
      const c = cur.claims || {}; let k = 0;
      for (let i = 0; i < pl.length; i++) if (c[i] != null) k++;
      cur.go = pl.length > 0 && k >= pl.length;
    }
    applyTiming(cur, nowS());
    return cur;
  });
}
$('start').onclick = () => {
  if (!g) return;
  if (!g.started){ if (isAdmin()) launch(); }
  else { proceeded = true; render(); }
};

/* ---------- Qui es-tu ? ---------- */
function claim(i){
  ref.transaction(cur => {
    if (!cur) return cur;
    const c = cur.claims = cur.claims || {};
    if (c[i] != null && c[i] !== dev) return;                 // déjà pris par un autre téléphone
    for (const k in c) if (c[k] === dev) delete c[k];         // un seul joueur par téléphone
    c[i] = dev;
    return cur;
  }, (err, ok) => { if (ok) checkGo(); });
}
// quand tout le monde a choisi son nom, les chronos démarrent
function checkGo(){
  ref.transaction(cur => {
    if (!cur) return cur;
    if (!cur.started || cur.go) return;
    const n = (cur.players || []).length, c = cur.claims || {};
    let k = 0;
    for (let i = 0; i < n; i++) if (c[i] != null) k++;
    if (k < n) return;
    cur.go = true; cur.ts = nowS();                          // la partie démarre : le compte à rebours aussi
    applyTiming(cur, nowS());
    return cur;
  });
}
function renderWho(){
  show('who');
  const box = $('whoList'); box.innerHTML = '';
  const claims = g.claims || {};
  players().forEach((p, i) => {
    const taken = !!claims[i] && claims[i] !== dev;
    const b = document.createElement('button');
    b.innerHTML = esc(p.name) + (taken ? '<small style="display:block;font-size:14px;opacity:.85">déjà pris</small>' : '');
    b.disabled = taken;
    b.style.cssText = `display:block;width:100%;margin:12px 0;padding:24px;font-size:24px;border-radius:24px;` +
      `background-color:${p.color};` +
      `color:${textOn(p.color)};border:1px solid rgba(255,255,255,.7)`;
    b.onclick = () => claim(i);
    box.append(b);
  });
}

/* ---------- Jeu ---------- */
// compte à rebours : {until} = échéance ; {pending} = en attente du lancement manuel
function cdSecs(v){ const x = +(v.options && v.options.cdSecs); return x >= 5 ? x : 60; }
function cdInfo(v){
  if (!v || !v.started || !v.go || v.reorder || v.ended) return null;
  const o = v.options || {};
  if (o.cd && v.ts) return {until: v.ts + cdSecs(v) * 1000};
  if (o.cdm && modeOf(v) === 'sim'){
    if (v.cdm && v.cdm.t) return {until: v.cdm.t + cdSecs(v) * 1000};
    return {pending: cdSecs(v)};
  }
  return null;
}
function renderCd(){
  const el = $('cd');
  const c = (g && g.started && !waiting) ? cdInfo(g) : null;
  if (!c){ el.style.display = 'none'; return; }
  el.style.display = '';
  if (c.pending){ el.innerHTML = 'Compte à rebours de ' + c.pending + ' s dès que le 1<sup>er</sup> joueur a fini'; el.classList.remove('low'); return; }
  const rem = Math.max(0, c.until - nowS());
  el.textContent = 'Compte à rebours ' + fmt(rem + 999);
  el.classList.toggle('low', rem <= 10000);
}

function renderTimers(){
  if (!g || !g.started || meIdx === null) return;
  renderCd();
  const mode = modeOf(), list = players();
  if (mode === 'solo'){
    $('timer').style.display = 'none';
    if ($('big').className === 'clock') $('big').textContent = fmt(totalMs());
    return;
  }
  const me = list[meIdx];
  $('timer').style.display = '';
  $('timer').textContent = (me ? me.name + ' ' + fmt(elapsed(meIdx)) + ' · ' : '') + 'Total ' + fmt(totalMs());
}

function renderGame(){
  show('game');
  const list = players(), n = list.length, mode = modeOf(), o = g.options || {};
  const isSim = mode === 'sim', isSolo = mode === 'solo', showFirst = mode === 'seq' || mode === 'ia' || (isSim && !!o.rotate);
  const hostAll = mode === 'solo' || mode === 'ia';
  const cur = g.current % n, me = list[meIdx], gs = $('game');
  const done = g.done || {}, passed = g.passed || {};
  const reorder = !!g.reorder;

  // tant que tout le monde n'a pas choisi son nom : message d'attente et retour possible
  waiting = !hostAll && claimedCount() < n;
  const mine = !waiting && !reorder && (isSim ? !done[meIdx] : cur === meIdx);
  iAmActive = mine && !isSolo;
  const act = list[cur];
  $('gback').style.display = waiting ? '' : 'none';
  $('end').style.display = isAdmin() ? '' : 'none';      // seul l'admin termine la partie
  $('foot').style.display = isSolo ? 'none' : '';
  const wt = $('wait');
  if (waiting){
    const cl = g.claims || {};
    const names = list.filter((p, i) => cl[i] == null).map(p => p.name);
    wt.textContent = 'En attente de ' + (names.length > 1
      ? names.slice(0, -1).join(' ; ') + ' et ' + names[names.length - 1]
      : names[0]);
    wt.style.display = '';
  } else wt.style.display = 'none';

  // le stage (carré) prend la couleur du joueur ; toute la carte est cliquable à mon tour
  const sp = (isSim || isSolo) ? me : act;
  const st = $('stage');
  st.style.background = `linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 62%),${sp.color}`;
  st.style.color = textOn(sp.color);
  st.classList.toggle('tap', iAmActive);

  // pastilles d'ordre (avec le picto 1er joueur) et numéro de manche
  $('strip').style.display = isSolo ? 'none' : '';
  $('turnno').style.display = isSolo ? 'none' : '';
  $('strip').innerHTML = list.map((p, i) => {
    let cls = '';
    if (isSim) cls = done[i] ? 'dim' : '';
    else cls = (i === cur ? 'act ' : '') + (passed[i] ? 'dim' : '');
    return `<div class="chip ${cls}" style="background:${p.color};color:${textOn(p.color)}">${i === 0 && showFirst ? '1' : ''}</div>`;
  }).join('');
  // par manche : « Manche M · Tour N » (la manche ne change que quand tout le monde a passé) ; sinon « Tour N »
  $('turnno').textContent = (o.rounds && !isSim)
    ? 'Manche ' + (g.round || 1) + ' · Tour ' + (g.cycle || 1)
    : (o.rounds ? 'Manche ' : 'Tour ') + (g.round || 1);

  // mon nom : pastille à ma couleur, texte adapté
  const mn = $('myname');
  mn.style.setProperty('--pc', me.color);
  mn.style.setProperty('--pt', textOn(me.color));
  mn.querySelector('.nm').textContent = me.name + (passed[meIdx] ? ' a passé' : '');
  $('pass').style.display = (mine && o.rounds && !isSim && !isSolo) ? '' : 'none';

  const al = (g.alarm && g.alarm.turn === g.turn) ? g.alarm : null;
  const rem = al ? Math.max(0, Math.ceil((al.until - nowS()) / 1000)) : 0;
  const alMine = !!(al && al.player === meIdx);
  const alName = al && list[al.player] ? list[al.player].name : '';
  // message « Le tour de X est passé » (affiché ~4 s sur tous les écrans après une alarme)
  const sk = (g.skipped && g.skipped.turn === g.turn && nowS() < g.skipped.until) ? g.skipped : null;
  const key = isSim ? 'r' + (g.round || 1) : cur;
  if (prevCurrent !== key){ taps.length = 0; $('tapc').textContent = ''; }

  // clignotement : 'flash' (début de tour), 'slow' (alarme), 'fast' (5 dernières secondes)
  const setBlink = m => {
    if (gs.dataset.blink === m) return;
    gs.classList.remove('flash', 'slow', 'fast');
    void gs.offsetWidth;
    if (m) gs.classList.add(m);
    gs.dataset.blink = m;
  };

  gs.classList.toggle('lt', isLight(me.color));       // couleur claire : clignote blanc / gris clair
  if (isSolo){
    setBlink('');
    gs.style.background = `radial-gradient(70% 42% at 50% 30%,${rgba(me.color, .55)},transparent 72%),${LIGHT}`;
  } else if (mine){
    // plein écran à ma couleur
    gs.style.background = `radial-gradient(90% 55% at 50% 0%,rgba(255,255,255,.45),transparent 70%),${me.color}`;
    if (alMine){
      setBlink(rem <= 5 ? 'fast' : 'slow');
      if (alarmSnd !== al.until){ alarmSnd = al.until; sound('alarm'); }
    } else if (prevCurrent !== key || lastWaiting){
      myTurnSince = Date.now();
      setBlink('');
      setBlink('flash');
      if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 250]);
      sound('turn');

    } else {

    }
  } else if (sk){
    big.className = 'msg';
    big.textContent = sk.player === meIdx ? 'Ton tour est passé' : 'Le tour de ' + (list[sk.player] ? list[sk.player].name : '') + ' est passé';
    sub.textContent = mine ? 'À toi de jouer !' : (isSim ? '' : act.name + ' joue maintenant');
  } else if (isSim){
    if (mine){ big.textContent = 'JOUE !'; sub.textContent = 'Touche ici quand tu as fini'; }
    else {
      const names = list.filter((p, i) => !done[i]).map(p => p.name);

  syncReorder();
}

// J'ai fini mon tour (ou, en simultané, ma partie)
function endTurn(){
  if (!g || !g.started || meIdx === null || waiting) return;
  const mode = modeOf(), me = meIdx;
  if (mode === 'solo') return;
  ref.transaction(cur => {
    if (!cur) return cur;
    if (!cur.go || cur.reorder || cur.ended) return;
    const n = cur.players.length, now = nowS();
    if (modeOf(cur) === 'sim'){
      if (cur.done && cur.done[me]) return;
      finishSim(cur, me, now);
    } else {
      if ((cur.current % n) !== me) return;           // plus mon tour : on annule
      advance(cur, 'play', now);
    }
    return cur;
  });
}
// « Passer son tour » : fin de la manche pour ce joueur
function passTurn(){

function syncReorder(){
  if (statsOpen) return;
  if (g.reorder){
    if (!reorderOpen || reorderRound !== g.reorder.round){
      reorderOpen = true; reorderRound = g.reorder.round;
      const n = players().length;
      draft = Array.from({length: n}, (_, i) => (i + 1) % n);   // proposition : le 2e joueur devient 1er
      drawReorder();
    }
  } else if (reorderOpen){ reorderOpen = false; closeSheet(); }
}
function drawReorder(){
  const list = players();
  let h = '<div class="sh-title">Nouvelle manche</div>' +
          '<div class="sh-sub">Choisis le 1<sup>er</sup> joueur (bouton « 1<sup>er</sup> ») ou réorganise l\'ordre du tour, puis valide.</div><div>';
  draft.forEach((oi, pos) => {
    const p = list[oi];
    h += `<div class="pl">${dotHtml(p, pos === 0)}` +
         `<div class="nm">${pos + 1}. ${esc(p.name)}</div>` +
         (pos > 0 ? `<button data-a="first" data-p="${pos}">1<sup>er</sup></button>` : '') +
         `<button data-a="up" data-p="${pos}" ${pos === 0 ? 'disabled' : ''}>↑</button>` +
         `<button data-a="dn" data-p="${pos}" ${pos === draft.length - 1 ? 'disabled' : ''}>↓</button></div>`;
  });
  h += '</div>';
  setSheet(h, 'Valider', commitReorder, false);
  $('sbody').onclick = e => {

    else { const j = a === 'up' ? pos - 1 : pos + 1; [draft[pos], draft[j]] = [draft[j], draft[pos]]; }
    drawReorder();
  };
}
function commitReorder(){
  const perm = draft.slice(), rd = reorderRound;
  ref.transaction(cur => {
    if (!cur) return cur;
    if (!cur.reorder || cur.reorder.round !== rd) return;     // déjà validé par un autre téléphone
    applyReorder(cur, perm, nowS());

  });
}

// cohérence rang / points : renvoie la liste des anomalies (vide = tout va bien)
function checkResults(list, rank, pts){
  const out = [], n = list.length, nm = i => list[i].name;
  const rk = Object.keys(rank);
  rk.forEach(i => { if (!(rank[i] >= 1 && rank[i] <= n && rank[i] % 1 === 0)) out.push('Le rang de ' + nm(i) + ' (' + rank[i] + ') doit être un entier entre 1 et ' + n + '.'); });
  if (rk.length && rk.length < n) out.push('Le classement est incomplet : ' + rk.length + ' rang(s) saisi(s) pour ' + n + ' joueurs.');
  if (rk.length && !rk.some(i => rank[i] === 1)) out.push('Aucun joueur n\'est classé n°1.');
  const both = rk.filter(i => pts[i] != null);
  let desc = 0, asc = 0;
  for (let a = 0; a < both.length; a++){
    for (let b = a + 1; b < both.length; b++){
      const x = both[a], y = both[b], dp = pts[x] - pts[y], dr = rank[x] - rank[y];
      if (dp === 0 && dr !== 0) out.push(nm(x) + ' et ' + nm(y) + ' ont les mêmes points mais des rangs différents.');
      else if (dp !== 0 && dr === 0) out.push(nm(x) + ' et ' + nm(y) + ' ont le même rang mais des points différents.');
      else if (dp !== 0){ if ((dp > 0) === (dr < 0)) desc++; else asc++; }   // plus de points = meilleur rang (ou l'inverse)
    }
  }
  if (desc && asc) out.push('Le classement ne suit pas les points : certains ont plus de points et un moins bon rang, d\'autres l\'inverse.');
  return out.slice(0, 5);
}
async function finishGame(){
  const list = players(), rank = {}, pts = {};
  list.forEach((p, i) => {
    const rk = $('rk' + i), pt = $('pt' + i);
    if (rk && rk.value !== '' && !isNaN(+rk.value)) rank[i] = +rk.value;
    if (pt && pt.value !== '' && !isNaN(+pt.value)) pts[i] = +pt.value;
  });
  const issues = checkResults(list, rank, pts);
  if (issues.length){
    // « Modifier » ramène à la saisie (la fiche reste ouverte), « Valider » termine la partie telle quelle
    const sure = await uiModal('Les résultats semblent incohérents :\n\n• ' + issues.join('\n• ') + '\n\nÊtes-vous sûr de ces résultats ?', true, 'Valider', 'Modifier');
    if (!sure) return;
  }
  // pas de rang saisi mais des points : classement automatique (ex æquo = même rang)
  if (!Object.keys(rank).length && Object.keys(pts).length > 1){
    const ids = Object.keys(pts).sort((a, b) => pts[b] - pts[a]);
    ids.forEach((id, q) => { rank[id] = (q > 0 && pts[ids[q - 1]] === pts[id]) ? rank[ids[q - 1]] : q + 1; });
  }
  closeSheet();
  const r = ref;
  r.transaction(cur => {
    if (!cur) return cur;
    if (cur.ended) return;
    cur.ended = true;
    if (Object.keys(rank).length || Object.keys(pts).length){
      cur.result = {rank: Object.keys(rank).length ? rank : null, pts: Object.keys(pts).length ? pts : null};
    }
    applyTiming(cur, nowS());          // fige tous les chronos
    return cur;
  }, (err, ok, snap) => {
    if (err){ uiAlert('Impossible de terminer la partie : ' + err.message); return; }
    if (!ok) return;
    try { saveStats(snap.val()); } catch (e) {}
    setTimeout(() => r.remove(), 60000);      // la base est vidée une minute plus tard
  });
}

// statistiques des joueurs favoris : une ligne par partie (avec le nom du jeu) et un cumul par jour
function saveStats(v){

    const e = {date: today, ts: firebase.database.ServerValue.TIMESTAMP, game: v.name || '', ext: !!v.ext, mode: modeOf(v),
               ms: ms, totalMs: totalMs(v), hurry: hu, rewind: !!(v.rw && v.rw[i]), players: list.length, rounds: v.round || 1};
    if (rk[i] != null) e.rank = rk[i];
    if (pt[i] != null) e.points = pt[i];
    db.ref('favStats/' + k + '/games').push(e).catch(() => {});
    db.ref('favStats/' + k + '/days/' + today).transaction(x => {
      x = x || {games: 0, ms: 0, points: 0, wins: 0};
      x.games += 1; x.ms += ms; x.points += (pt[i] != null ? pt[i] : 0);
      if (rk[i] === 1) x.wins += 1;
      return x;
    }).catch(() => {});
  });
}

/* ---------- Rewind : on touche son nom ---------- */
// Une seule fois par joueur et par partie : retour à son dernier tour dans l'historique de la manche.
// Impossible si on n'a pas encore joué, ou si on a passé son tour.
function lastPlayIndex(log, me){
  for (let q = log.length - 1; q >= 0; q--) if (log[q] && log[q].p === me && log[q].a !== 'pass') return q;
  return -1;
}
function canRewind(){
  if (!g || !g.started || meIdx === null || g.reorder) return false;
  const o = g.options || {}, mode = modeOf();
  if (!o.rewind || !(mode === 'seq' || mode === 'ia')) return false;   // option désactivée / mode sans rewind
  const me = meIdx;
  if (g.rw && g.rw[me]) return false;                         // déjà utilisé
  if (g.passed && g.passed[me]) return false;                 // a passé son tour
  return lastPlayIndex(g.log || [], me) >= 0;                 // a déjà joué au moins une fois
}
function disarm(){
  armed = false; rwBusy = false;
  clearTimeout(rewTimer);
  $('myname').classList.remove('armed', 'spin');
}
function shake(){
  const el = $('myname');
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function doRewind(){
  const me = meIdx;
  ref.transaction(cur => {
    if (!cur) return cur;
    const o = cur.options || {};
    if (!o.rewind || cur.reorder || cur.ended) return;
    if (cur.rw && cur.rw[me]) return;                          // déjà utilisé
    if (cur.passed && cur.passed[me]) return;
    const log = (cur.log || []).slice();
    const k = lastPlayIndex(log, me);
    if (k < 0) return;                                         // je n'ai pas encore joué
    const removed = log.length - k, rest = log.slice(0, k), n = cur.players.length;
    cur.log = rest.length ? rest : null;
    cur.turn = Math.max(1, (cur.turn || 1) - removed);
    cur.current = me;
    if (o.rounds){
      cur.cycle = (log[k] && log[k].cy) || 1;                    // retour au numéro de tour de ce moment
      const ps = {}; let any = false;
      rest.forEach(e => { if (e.a === 'pass'){ ps[e.p] = true; any = true; } });
      cur.passed = any ? ps : null;
    } else if (!o.rotate) cur.round = Math.floor((cur.turn - 1) / n) + 1;
    cur.alarm = null; cur.hurry = null; cur.skipped = null;
    cur.rw = cur.rw || {}; cur.rw[me] = true;
    cur.ts = nowS();
    cur.rwFx = {id: Date.now() + '-' + me, by: me};            // déclenche l'animation sur tous les écrans
    applyTiming(cur, nowS());
    return cur;
  });
}
$('myname').onclick = e => {
  e.stopPropagation();
  if (rwBusy) return;
  if (!(g && g.options && g.options.rewind)) return;          // pas de rewind dans cette partie
  if (!armed){
    if (!canRewind()){ shake(); return; }
    armed = true;
    $('myname').classList.add('armed');                        // la zone devient « Rewind »
