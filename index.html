  setTimeout(() => { doRewind(); disarm(); }, 650);
};

/* ---------- Option « Plus vite ! » (tour par tour) ---------- */
// Chaque joueur (qui n'est pas actif) compte ses tapotements : 10 en 10 s => il envoie son « vote »
$('game').addEventListener('pointerdown', e => {
  if (!g || !g.started || waiting || meIdx === null || g.reorder || modeOf() !== 'seq' || !(g.options && g.options.hurry)) return;
  const n = players().length;
  if (g.current % n === meIdx) return;                       // c'est mon tour : pas de vote
  if (g.alarm && g.alarm.turn === g.turn) return;            // alarme déjà en cours
  if (e.target.closest('#myname,#end,#gback,#pass,#turnno,#snd')) return;
  const t = Date.now();
  taps.push(t);
  while (taps.length && t - taps[0] > 10000) taps.shift();
  $('tapc').textContent = taps.length >= 3 ? (Math.min(taps.length, 10) + ' / 10') : '';
  clearTimeout(tapcTimer); tapcTimer = setTimeout(() => { $('tapc').textContent = ''; }, 1500);
  if (taps.length >= 10){ taps.length = 0; $('tapc').textContent = 'Envoyé !'; sendHurry(); }
});

function sendHurry(){
  const me = meIdx;
  ref.transaction(cur => {
    if (!cur) return cur;
    if (!cur.started || cur.reorder || modeOf(cur) !== 'seq') return;
    const n = cur.players.length;
    const c = cur.current % n;
    if (c === me) return;
    if (cur.alarm && cur.alarm.turn === cur.turn) return;
    const now = nowS();
    cur.hurry = cur.hurry || {};
    cur.hurry[me] = {t: now, turn: cur.turn};
    let all = true;
    for (let i = 0; i < n; i++){
      if (i === c) continue;
      const h = cur.hurry[i];
      if (!h || h.turn !== cur.turn || now - h.t > 10000){ all = false; break; }
    }
    if (all){
      cur.alarm = {player: c, turn: cur.turn, until: now + 30000}; cur.hurry = null;
      cur.st = cur.st || {}; cur.st.hurry = cur.st.hurry || {};
      cur.st.hurry[c] = (cur.st.hurry[c] || 0) + 1;              // compté pour les statistiques de fin
    }
    return cur;
  });
}

// Fin du compte à rebours : n'importe quel téléphone applique le time out (la transaction évite les doublons)
let cdExp = null;
function expireCountdown(until){
  if (cdExp === until) return;
  cdExp = until;
  ref.transaction(cur => {
    if (!cur) return cur;
    const c = cdInfo(cur);
    if (!c || !c.until || nowS() < c.until - 1000) return;
    const now = nowS(), mode = modeOf(cur), n = cur.players.length;
    let pen = cur.current % n, all = false;
    if (mode === 'sim'){
      // simultané : tous ceux qui n'ont pas fini sont terminés d'office
      const o = cur.options, h = o.hurry; o.hurry = false;
      const left = [];
      for (let k = 0; k < n; k++) if (!(cur.done && cur.done[k])) left.push(k);
      left.forEach(k => finishSim(cur, k, now));
      if (h === undefined) delete o.hurry; else o.hurry = h;
      pen = left.length ? left[0] : 0; all = true;
    } else if (mode === 'solo'){
      cur.ts = now; cur.cdm = null; pen = 0; all = true;           // un seul joueur : le compte à rebours repart
    } else {
      advance(cur, 'skip', now);                                   // le tour est passé
      cur.skipped = {player: pen, turn: cur.turn, until: now + 4000};
    }
    cur.toFx = {id: now + '-' + pen, by: pen, all: all};
    return cur;
  }, (err, ok) => { if (!ok) setTimeout(() => { if (cdExp === until) cdExp = null; }, 1500); });
}

// Fin de l'alarme : n'importe quel téléphone peut passer le tour (la transaction évite les doublons)
function expireAlarm(){
  const al = g && g.alarm;
  if (!al || expiringFor === al.until) return;
  expiringFor = al.until;
  ref.transaction(cur => {
    if (!cur || !cur.alarm) return cur;
    if (cur.alarm.turn !== cur.turn || nowS() < cur.alarm.until - 1000) return;
    const now = nowS(), pen = cur.alarm.player;                // joueur pénalisé
    if (modeOf(cur) === 'sim') finishSim(cur, pen, now);       // simultané : sa partie est terminée d'office
    else advance(cur, 'skip', now);
    cur.skipped = {player: pen, turn: cur.turn, until: now + 4000};
    cur.toFx = {id: now + '-' + pen, by: pen};                  // déclenche l'écran « Time out » (3 s) sur tous les téléphones
    return cur;
  });
}
setInterval(() => {
  if (!g || !g.started || meIdx === null || g.ended) return;
  const sk = g.skipped;
  const skActive = sk && sk.turn === g.turn && nowS() < sk.until + 600;
  if (g.alarm && nowS() >= g.alarm.until) expireAlarm();
  const cdc = cdInfo(g);
  if (cdc && cdc.until && nowS() >= cdc.until) expireCountdown(cdc.until);
  if (!$('game').classList.contains('on')) return;
  if (g.alarm || skActive) renderGame();   // compte à rebours et message « tour passé »
  else renderTimers();                     // chronos en direct
}, 500);

/* ---------- Écran toujours allumé ---------- */
let wl = null;
async function keepAwake(){
  try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.addEventListener('click', keepAwake, {once: true});

/* ---------- Reprise automatique ---------- */
updateHome();
const last = localStorage.getItem('tour_code');
if (last){ $('code').value = last; join(last); }
</script>

<!-- Accès administrateur : 3 clics rapides sur le titre de l'accueil -->
<script>
(function () {
  const title = document.querySelector('#home h1');
  if (!title) return;
  title.style.cssText += ';cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation';

  let count = 0, timer = null;
  title.addEventListener('click', () => {
    count++;
    clearTimeout(timer);
    timer = setTimeout(() => { count = 0; }, 800);
    if (count === 3) { count = 0; loginAsAdmin(); }
  });

  function showUid(uid, isAdm) {
    let el = document.getElementById('adminInfo');
    let del = document.getElementById('adminDel');
    let out = document.getElementById('adminOut');
    if (!uid) { if (el) el.remove(); if (del) del.remove(); if (out) out.remove(); return; }
    if (!out) {
      out = document.createElement('button');
      out.id = 'adminOut';
      out.textContent = '(╯°□°)╯︵ ┻━┻';
      out.style.cssText = 'position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:5;font-size:14px;padding:6px 14px';
      out.onclick = () => firebase.auth().signOut().catch(e => uiAlert('Erreur : ' + e.message));
      document.getElementById('home').appendChild(out);
    }
    if (!isAdm && del) { del.remove(); del = null; }
    if (isAdm && !del) {
      del = document.createElement('button');
      del.id = 'adminDel';
      del.textContent = 'Supprimer les parties en cours';
      del.style.cssText = 'display:block;margin:12px auto;font-size:15px;padding:10px 18px;color:#d93025';
      del.onclick = async () => {
        if (!await uiConfirm('Supprimer toutes les parties en cours ? Tous les joueurs reviendront à l\'accueil.', 'Supprimer')) return;
        db.ref('games').remove().then(() => {
          db.ref('lobby').remove().catch(() => {});
          localStorage.removeItem('tour_code');
          uiAlert('Parties supprimées.');
        }).catch(e => uiAlert('Suppression refusée : ' + e.message + '\n(Vérifie les règles Firebase : droit d\'écriture sur « games » pour l\'admin.)'));
      };
      document.querySelector('#home .wrap').appendChild(del);
    }
    if (!el) {
      el = document.createElement('div');
      el.id = 'adminInfo';
      el.style.cssText = 'margin:12px 0;text-align:center;font-size:13px;color:rgba(27,34,51,.6);user-select:text;-webkit-user-select:text;word-break:break-all';
      document.querySelector('#home .wrap').appendChild(el);
    }
    el.textContent = (isAdm ? 'Administrateur connecté' : 'Connecté (non administrateur)') + ' — UID : ' + uid;
  }
  // le bouton admin n'apparaît que si l'UID figure dans /admins
  function refresh(u) {
    if (!u) { showUid(null); return; }
    showUid(u.uid, false);
    db.ref('admins/' + u.uid).once('value')
      .then(s => showUid(u.uid, !!s.val()))
      .catch(() => showUid(u.uid, false));
  }

  function loginAsAdmin() {
    if (typeof firebase === 'undefined' || typeof firebase.auth !== 'function') {
      uiAlert("Le module Firebase Auth n'est pas chargé (firebase-auth-compat.js).");
      return;
    }
    const auth = firebase.auth();
    if (auth.currentUser) { refresh(auth.currentUser); return; }
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => uiAlert('Erreur de connexion Google :\n' + e.code + '\n' + e.message));
  }

  if (typeof firebase !== 'undefined' && typeof firebase.auth === 'function') {
    firebase.auth().onAuthStateChanged(u => refresh(u));
  }
})();
</script>

    function faceFor(v) {
      if (f !== 4) return G[faceOf[v]];
      var iv = vertOf[v], r = G[0];
      G.forEach(function (F) { if (F.vi.indexOf(iv) < 0) r = F; });      /* d4 : la face contre la table est opposée au sommet du résultat */
      return r;
    }
    function clearHit() { lit.forEach(function (n) { n.classList.remove('dq-hit'); }); lit = []; }
    apply(q);
    return {
      el: w, hop: w.querySelector('.dq-hop'), sh: w.querySelector('.dq-sh'),
      stop: function () { cancelAnimationFrame(raf); },
      hit: function (on) {
        clearHit();
        if (!on) return;
        lit = (f === 4 ? vmarks[vertOf[cur]] : marks[faceOf[cur]]) || [];
        lit.forEach(function (n) { n.classList.add('dq-hit'); });
      },
      set: function (v, spin, dur) {
        cancelAnimationFrame(raf); clearHit(); cur = v;
        var F = faceFor(v), Rm = mmul(worldMat(f === 4 ? 1 : -1, (Math.random() - .5) * .7), [F.ex, F.ey, F.ez]), q1 = matq(Rm), bot = -1e9, t;
        for (t = 0; t < V.length; t++) bot = Math.max(bot, Rm[1][0] * V[t][0] + Rm[1][1] * V[t][1] + Rm[1][2] * V[t][2]);
        shw.style.transform = 'translate3d(' + (R * .05).toFixed(1) + 'px,' + (bot * R + .5).toFixed(1) + 'px,0) rotateX(90deg)';
        if (!spin) { q = q1; apply(q); return; }
        var q0 = q, ax = nrm([Math.random() - .5, Math.random() - .5, Math.random() - .5]), turns = 2 + rnd(2), t0 = performance.now(), rd = dur * 720;
        (function step(now) {
          var u = Math.min(1, (now - t0) / rd), e = 1 - Math.pow(1 - u, 3);
          q = qmul(qaxis(ax, Math.PI * 2 * turns * e), qslerp(q0, q1, e));
          apply(q);
          if (u < 1) raf = requestAnimationFrame(step); else { q = q1; apply(q); }
        })(t0);
      }
    };
  }

  /* ---------- Pièce à plat sur la table, avec de l'épaisseur ---------- */
  function makeCoin(s) {
    var w = div('dq-d'), t = Math.round(s * 0.17), N = 44, R = s / 2, D = s * 1.25;
    w.innerHTML = '<div class="dq-scene"><div class="dq-shw"><div class="dq-sh"></div></div><div class="dq-hop"><div class="dq-cn" style="--t:' + t + 'px">' +
      '<div class="dq-cf">Pile</div><div class="dq-cf b">Face</div></div></div></div>';
    var cn = w.querySelector('.dq-cn'), shw = w.querySelector('.dq-shw'), A = 90, ph = 0, i, side = 0, f1 = w.querySelectorAll('.dq-cf');
    shw.style.cssText = 'width:' + D + 'px;height:' + D + 'px;margin:' + (-D / 2) + 'px 0 0 ' + (-D / 2) + 'px;transform:translate3d(' + (s * .05).toFixed(1) + 'px,' + (t / 2 + .5) + 'px,0) rotateX(90deg)';
    var chord = 2 * R * Math.sin(Math.PI / N) + 1.4, ap = R * Math.cos(Math.PI / N);
    for (i = 0; i < N; i++) {
      var sg = div('dq-rim');
      sg.style.cssText = 'width:' + chord.toFixed(2) + 'px;height:' + t + 'px;margin:' + (-t / 2) + 'px 0 0 ' + (-chord / 2).toFixed(2) + 'px;background:' + (i % 2 ? '#b08a1c' : '#c9a227') +
        ';transform:rotateZ(' + (i * 360 / N) + 'deg) translateY(' + (-ap).toFixed(2) + 'px) rotateX(90deg)';
      cn.appendChild(sg);
    }
    cn.style.transform = 'rotateY(0deg) rotateX(90deg)';
    return {
      el: w, hop: w.querySelector('.dq-hop'), sh: w.querySelector('.dq-sh'),
      hit: function (on) { f1.forEach(function (e) { e.classList.remove('hit'); }); if (on) { void cn.offsetWidth; f1[side].classList.add('hit'); } },
      set: function (v, spin, dur) {
        side = v === 1 ? 0 : 1;
        var base = side ? 270 : 90;
        ph = (Math.random() - .5) * 50;
        if (spin) A = (Math.floor(A / 360) + 2 + rnd(2)) * 360 + base; else A = base;
        cn.style.transition = spin ? 'transform ' + (dur * .72) + 's cubic-bezier(.2,.7,.2,1)' : 'none';
        cn.style.transform = 'rotateY(' + ph.toFixed(1) + 'deg) rotateX(' + A + 'deg)';
      }
    };
  }

  var dice = [], busy = false, resTimer = null;
  var ov = div('dq-ov');
  ov.id = 'dq-dice';
  ov.innerHTML = '<div class="dq-box" role="dialog" aria-label="Lancer des dés">' +
    '<button class="dq-ic dq-gear" type="button" aria-label="Réglages">' + IC_GEAR + '</button>' +
    '<button class="dq-ic dq-x" type="button" aria-label="Fermer">' + IC_X + '</button>' +
    '<div class="dq-set"><div class="dq-l" id="dq-nl"></div><div class="dq-seg" id="dq-n"></div>' +
    '<div class="dq-l">Faces</div><div class="dq-seg f" id="dq-f"></div></div>' +
    '<div class="dq-stage" id="dq-stage"></div>' +
    '<div class="dq-res" id="dq-res" aria-live="polite"></div>' +
    '<button class="pri dq-roll" id="dq-roll" type="button">Lancer</button></div>';
  document.body.appendChild(ov);
  var stage = $('dq-stage'), resEl = $('dq-res'), rollBtn = $('dq-roll');
  var gear = ov.querySelector('.dq-gear'), setBox = ov.querySelector('.dq-set');

  function drawSeg() {
    $('dq-nl').textContent = cfg.f === 2 ? 'Nombre de pièces' : 'Nombre de dés';
    var nb = $('dq-n'), fb = $('dq-f'); nb.innerHTML = ''; fb.innerHTML = '';
    for (var i = 1; i <= 6; i++) (function (i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = i;
      if (i === cfg.n) b.className = 'sel';
      b.onclick = function () { cfg.n = i; saveCfg(); drawSeg(); build(); };
      nb.appendChild(b);
    })(i);
    FACES.forEach(function (f) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = f === 2 ? 'Pièce' : f;
      if (f === cfg.f) b.className = 'sel';
      b.onclick = function () { cfg.f = f; saveCfg(); drawSeg(); build(); };
      fb.appendChild(b);
    });
  }
  function build() {
    dice.forEach(function (d) { if (d.stop) d.stop(); });
    stage.innerHTML = ''; dice = [];
    var sz = cfg.n <= 2 ? 84 : cfg.n <= 4 ? 70 : 60;
    stage.style.setProperty('--s', sz + 'px');
    for (var i = 0; i < cfg.n; i++) {
      var d = cfg.f === 2 ? makeCoin(sz) : makePoly(cfg.f, sz);
      d.set(1 + rnd(cfg.f), false, 0);
      stage.appendChild(d.el); dice.push(d);
    }
    clearTimeout(resTimer); busy = false;
    resEl.classList.remove('dim');
    resEl.innerHTML = '<div class="dq-big">—</div>';
    rollBtn.textContent = 'Lancer';
  }
  function roll() {
    if (busy) return;
    busy = true; rollBtn.textContent = 'Ça roule…'; resEl.classList.add('dim'); resEl.classList.remove('hit'); dice.forEach(function (d) { if (d.hit) d.hit(false); });
    var vals = dice.map(function () { return 1 + rnd(cfg.f); }), maxd = 0;
    dice.forEach(function (d, i) {
      var dur = 1.2 + i * 0.12; maxd = Math.max(maxd, dur);
      d.hop.style.animationDuration = dur + 's'; d.sh.style.animationDuration = dur + 's';
      restart(d.hop); restart(d.sh);
      d.set(vals[i], true, dur);
    });
    resTimer = setTimeout(function () {
      var html;
      if (cfg.f === 2) {
        var p = vals.filter(function (v) { return v === 1; }).length, f = vals.length - p;
        html = '<div class="dq-big">' + (vals.length === 1 ? (p ? 'Pile' : 'Face') : p + ' pile' + (p > 1 ? 's' : '') + ' · ' + f + ' face' + (f > 1 ? 's' : '')) + '</div>';
      } else {
        var sum = vals.reduce(function (a, b) { return a + b; }, 0);
        html = '<div class="dq-big">' + sum + '</div>' + (vals.length > 1 ? '<div class="dq-sub">' + vals.join(' + ') + '</div>' : '');
      }
      resEl.innerHTML = html; resEl.classList.remove('dim'); void resEl.offsetWidth; resEl.classList.add('hit'); dice.forEach(function (d) { if (d.hit) d.hit(true); });
      rollBtn.textContent = 'Relancer'; busy = false;
      if (navigator.vibrate) navigator.vibrate(30);
    }, maxd * 1000 + 250);
  }
  function openDice() { drawSeg(); build(); setBox.classList.remove('on'); gear.classList.remove('sel'); ov.classList.add('on'); }
  function closeDice() { ov.classList.remove('on'); clearTimeout(resTimer); busy = false; dice.forEach(function (d) { if (d.stop) d.stop(); }); }
  gear.onclick = function () { var o = setBox.classList.toggle('on'); gear.classList.toggle('sel', o); };
  ov.querySelector('.dq-x').onclick = closeDice;
  ov.onclick = function (e) { if (e.target === ov) closeDice(); };
  rollBtn.onclick = roll;

  var diceBtn = document.createElement('button');
  diceBtn.type = 'button'; diceBtn.className = 'dq-btn'; diceBtn.innerHTML = IC_DICE + '<span>Lancer des dés</span>';
  diceBtn.onclick = openDice;
  document.body.appendChild(diceBtn);

  // visible seulement pour le joueur actif (ou en solo)
  function canDice() {
    try {
      if (!$('game').classList.contains('on') || !g || !g.started || g.ended || g.reorder) return false;
      return !!iAmActive || modeOf() === 'solo';
    } catch (e) { return false; }
  }

  /* ====================================================================
     QR CODE
     ==================================================================== */
  function siteUrl() { return (location.origin + location.pathname).replace(/index\.html$/, ''); }
  function qrSvg(url) {
    var q = qrcode(0, 'M'); q.addData(url); q.make();
    var n = q.getModuleCount(), m = 2, d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
    var t = n + 2 * m;
    return '<svg viewBox="0 0 ' + t + ' ' + t + '" shape-rendering="crispEdges" role="img" aria-label="QR code du site"><rect width="' + t + '" height="' + t + '" fill="#fff"/><path d="' + d + '" fill="#111"/></svg>';
  }

  var home = document.querySelector('#home .wrap');
  var hq = div('dq-qrhome glass'); hq.setAttribute('role', 'button'); hq.tabIndex = 0; hq.style.display = 'none';
  if (home) home.appendChild(hq);
  var fl = document.createElement('button');
  fl.type = 'button'; fl.className = 'dq-qrfloat'; fl.setAttribute('aria-label', 'Agrandir le QR code'); fl.hidden = false;
  document.body.appendChild(fl);
  var qov = div('dq-ov'); qov.style.zIndex = '93';
  qov.innerHTML = '<div class="dq-qrbig" role="button" aria-label="Fermer"></div>';
  document.body.appendChild(qov);
  var svg = '';
  function openQR() { if (!svg) return; qov.firstChild.innerHTML = svg; qov.classList.add('on'); }
  function closeQR() { qov.classList.remove('on'); }
  hq.onclick = openQR; fl.onclick = openQR; qov.onclick = closeQR;
  hq.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openQR(); } };

  try {
    svg = qrSvg(siteUrl());
    hq.innerHTML = svg; hq.style.display = ''; fl.innerHTML = svg;
  } catch (e) {}

  /* ---------------- Visibilité (l'appli change d'écran sans événement) ---------------- */
  function poll() {
    var can = canDice();
    diceBtn.classList.toggle('on', can);
    if (!can && ov.classList.contains('on')) closeDice();
    fl.classList.toggle('on', !!svg && $('lobby').classList.contains('on'));
    if (!svg) return;
    if ($('lobby').classList.contains('on') === false && $('home').classList.contains('on') === false) closeQR();
  }
  setInterval(poll, 300);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDice(); closeQR(); } });
})();
</script>
