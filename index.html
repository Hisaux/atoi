<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tour de jeu">
<meta name="theme-color" content="#eef2fa">
<title>À qui le tour ?</title>
<style>
  :root{
    --ink:#1b2233;
    --ink2:rgba(27,34,51,.6);
    --glass:rgba(255,255,255,.52);
    --edge:rgba(255,255,255,.85);
    --sz:min(86vw,360px,40vh); /* côté du stage carré */
    --bg:radial-gradient(60% 50% at 15% 8%,#bcd6ff 0,transparent 62%),
         radial-gradient(50% 45% at 92% 18%,#ffd1e4 0,transparent 62%),
         radial-gradient(60% 50% at 70% 96%,#c6f1dc 0,transparent 62%),
         #eef2fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;color-scheme:light}

  .screen{display:none;position:fixed;inset:0;padding:max(22px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));overflow-y:auto}
  .screen.on{display:flex;flex-direction:column}
  .wrap{width:100%;max-width:460px;margin:0 auto}
  #home .wrap{margin:0 auto}

  /* ---------- Verre liquide ---------- */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
    border:1px solid var(--edge);
    box-shadow:0 10px 34px rgba(40,60,110,.14),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25);
    border-radius:28px;
  }
  .card{padding:20px;margin:14px 0}
  .pill{
    display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
    background:rgba(255,255,255,.55);border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 6px 20px rgba(40,60,110,.14),inset 0 1px 0 rgba(255,255,255,.95);
  }

  h1{
    font-size:44px;
    font-weight:600;
    letter-spacing:-.02em;
    margin:8px 0 24px 24px;
    text-align:center;
  }
  h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 12px}
  .lead{color:var(--ink2);font-size:17px;margin:0 0 14px}
  .lab{display:block;font-size:16px;font-weight:700;letter-spacing:.06em;color:var(--ink2);margin:0 0 10px}

  input[type=text]{
    width:100%;padding:15px 16px;font:inherit;font-size:18px;border-radius:8px;
    border:1px solid lightgray;background:rgba(255,255,255,.62);color:var(--ink);
  }
  input:focus,input:focus-visible{outline:none;box-shadow:none}
  input[type=text].bad{border-color:#d93025}
  .h2row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
  .h2row h2{margin:0}
  button.sm{font-size:13px;padding:6px 12px}
  input::placeholder{color:rgba(27,34,51,.4)}
  input[type=color]{width:54px;height:54px;padding:4px;border:1px solid var(--edge);border-radius:50%;background:rgba(255,255,255,.62);flex:0 0 54px;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
  input[type=color]::-moz-color-swatch{border:0;border-radius:50%}

  button{
    font:inherit;font-size:18px;font-weight:400;padding:12px 24px;border-radius:60px;cursor:pointer;
    color:var(--ink);background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:transform .12s;
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45}
  button.pri{
    color:#fff;background:#2d69eb;
  }
  button.link{
    background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;
    padding:4px 0;font-size:14px;font-weight:500;color:#2d69eb;
  }
  .row{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0}
  .row>*{flex:1}
  .row>button{flex:0 0 auto}

  .err{color:#d93025;margin-top:10px;min-height:20px;font-size:15px}
  #nameErr{margin:0;line-height:20px;text-align:center}
  .hint{color:var(--ink2);font-size:14px;margin:10px 0 0;line-height:1.4}
  .hint.ctr{text-align:center}

  /* préparation */
  .codebox{margin:0 0 10px}
  .codeval{font-size:36px;font-weight:700;letter-spacing:.04em;text-align:center;margin:8px 0 6px;word-break:break-all}
  .pl{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:10px 0;border-radius:22px;
    background:rgba(255,255,255,.55);border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 6px 20px rgba(40,60,110,.12),inset 0 1px 0 rgba(255,255,255,.95)}
  .pl .dot{width:30px;height:30px;border-radius:50%;flex:0 0 30px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.22)}
  .pl .nm{flex:1;font-size:18px;font-weight:600}
  .pl button{padding:8px 13px;font-size:16px;border-radius:14px}
  label.opt{display:flex;align-items:flex-start;gap:14px;padding:16px;font-size:17px;font-weight:600;line-height:1.3}
  label.opt input{flex:0 0 26px;width:26px;height:26px;margin:-2px 0 0;accent-color:#2d69eb}
  label.opt small{font-weight:400;color:var(--ink2);font-size:14px}

  /* écran de jeu */
  #game{padding:0}
  #gback{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:5}
  #top{display:flex;flex-direction:column;align-items:center;gap:10px;padding:max(16px,env(safe-area-inset-top)) 14px 0}
  #strip{padding:9px 14px;gap:9px;flex-wrap:wrap;justify-content:center}
  #strip .chip{width:22px;height:22px;border-radius:50%;border:2px solid #fff;opacity:.55;transition:transform .2s,opacity .2s}
  #strip .chip.act{opacity:1;transform:scale(1.3);box-shadow:0 0 0 3px rgba(27,34,51,.85)}
  #turnno{font-size:14px;font-weight:600;color:var(--ink2);padding:6px 14px}
  /* stage centré verticalement dans l'écran ; « en attente » est posé au-dessus sans le décaler */
  #main{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0}
  #wait{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(50% + var(--sz)/2 + 14px);
    width:max-content;max-width:min(92vw,420px);text-align:center;justify-content:center;font-size:16px;font-weight:600;line-height:1.3;border-radius:22px}
  #big.num{font-size:120px;line-height:1}
  #big.msg{font-size:30px;line-height:1.15}
  #modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(27,34,51,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #modal.on{display:flex}
  .mbox{width:min(100%,360px);padding:24px;text-align:center;background:rgba(255,255,255,.82)}
  #mtext{font-size:17px;line-height:1.4;white-space:pre-line;word-break:break-word;margin-bottom:20px}
  .mbtns{display:flex;gap:10px;justify-content:center}
  .mbtns button{flex:1;padding:12px 16px}
  #rwfx{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(27,34,51,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;
    font-size:28px;font-weight:700;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
  #rwfx.on{opacity:1}
  #rwfx svg{width:130px;height:130px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:ccw .8s linear infinite}
  #rwtxt{font-size:19px;font-weight:500;opacity:.9}
  /* le stage est un carré */
  #stage{width:var(--sz);aspect-ratio:1/1;padding:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    transition:transform .12s}
  #stage.tap{cursor:pointer}
  #stage.tap:active{transform:scale(.985)}
  #big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
  #sub{font-size:19px;margin-top:12px;color:inherit;opacity:.8;font-weight:500}
  /* le nom est à mi-chemin entre le bas du stage et le bas de l'écran : 75% + (taille du stage)/4 */
  #foot{position:absolute;left:50%;top:calc(75% + var(--sz)/4);transform:translate(-50%,-50%);z-index:3;text-align:center}
  /* le nom prend la couleur du joueur, le texte s'adapte pour rester lisible */
  #myname{font-size:19px;font-weight:700;padding:10px 20px;user-select:none;-webkit-user-select:none;cursor:pointer;
    background:var(--pc,rgba(255,255,255,.55));color:var(--pt,var(--ink))}
  #myname .rw{display:none;align-items:center;gap:8px}
  #myname.armed{background:rgba(27,34,51,.9);color:#fff;border-color:rgba(255,255,255,.3)}
  #myname.armed .nm{display:none}
  #myname.armed .rw{display:inline-flex}
  #myname .rw svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
    animation:ccw 1.6s linear infinite}
  #myname.spin .rw svg{animation-duration:.45s}
  @keyframes ccw{to{transform:rotate(-360deg)}}
  #myname.shake{animation:shake .32s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #tapc{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;font-size:20px;font-weight:700;pointer-events:none;
    padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid #fff;box-shadow:0 6px 20px rgba(40,60,110,.18)}
  #tapc:empty{display:none}
  #end{position:fixed;right:12px;bottom:max(10px,env(safe-area-inset-bottom));z-index:5;
    font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;color:#d93025}

  /* clignotements : 1 fois par seconde, la couleur du joueur alterne avec une version pâle */
  .flash{animation:blink 1s steps(1) 3}
  @keyframes blink{0%{filter:none}50%{filter:brightness(1.8) saturate(.35)}100%{filter:none}}
  .slow{animation:alarmblink 1s steps(1) infinite}
  .fast{animation:alarmblink .4s steps(1) infinite}
  @keyframes alarmblink{0%{filter:none}50%{filter:brightness(1.8) saturate(.35)}100%{filter:none}}
</style>
</head>
<body>

<!-- ACCUEIL -->
<div id="home" class="screen on">
  <div class="wrap">
    <h1>C'est à qui de jouer ?</h1>
    <div class="glass card">
      <label class="lab" for="code">Nom de la table</label>
      <input id="code" type="text" placeholder="ex. TABLE7" autocapitalize="characters" autocomplete="off">
      <div class="row" style="margin-top:16px"><button id="go" class="pri" disabled>En attente</button></div>
      <div class="err" id="homeErr"></div>
    </div>
  </div>
</div>

<!-- PRÉPARATION -->
<div id="lobby" class="screen">
  <div class="wrap">
    <div class="codeval" id="lobbyCode"></div>

    <div class="glass card">
      <h2>Ajouter un joueur</h2>
      <div class="row">
        <input id="pname" type="text" placeholder="Prénom" maxlength="14" autocomplete="off">
        <input id="pcolor" type="color" value="#e53935">
      </div>
      <div class="err" id="nameErr"></div>
      <div class="row"><button id="addP" class="pri">Ajouter</button></div>
    </div>

    <div class="glass card">
      <div class="h2row">
        <h2>Ordre de passage</h2>
        <button id="rand" class="pri sm" disabled>1er joueur au hasard</button>
      </div>
      <div id="plist"></div>
    </div>

    <div class="glass card">
      <h2>Option</h2>
      <label class="opt"><input type="checkbox" id="optRewind"><span>Rewind<br><small>Chaque joueur peut revenir une fois à son dernier tour (en touchant son nom).</small></span></label>
      <label class="opt"><input type="checkbox" id="optHurry"><span>Mode « Plus vite ! »<br><small>Si tous les autres tapotent 10 fois en 10 s, le joueur actif clignote 30 s puis son tour est passé.</small></span></label>
    </div>

    <div class="row" style="margin-top:16px"><button id="start" class="pri" disabled>Rejoindre</button></div>
  </div>
</div>

<!-- QUI ES-TU -->
<div id="who" class="screen">
  <div class="wrap">
    <button id="back" class="link">&lt; retour</button>
    <h1>Qui es-tu ?</h1>
    <div id="whoList"></div>
  </div>
</div>

<!-- JEU -->
<div id="game" class="screen">
  <button id="gback" class="link">&lt; retour</button>
  <div id="top">
    <div id="strip" class="pill"></div>
    <div id="turnno" class="pill"></div>
  </div>
  <div id="main">
    <div id="wait" class="pill" style="display:none"></div>
    <div id="stage" class="glass">
      <div id="big"></div>
      <div id="sub"></div>
    </div>
  </div>
  <div id="foot">
    <div id="myname" class="pill">
      <span class="nm"></span>
      <span class="rw">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Rewind
      </span>
    </div>
  </div>
  <div id="tapc"></div>
  <button id="end">Terminer la partie</button>
</div>

<!-- Déconnexion : oublie la session sur cet appareil (hors page de garde) -->
<button id="logout" class="link" style="display:none;position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:60">Déconnexion</button>

<!-- Modale des messages -->
<div id="modal">
  <div class="glass mbox">
    <div id="mtext"></div>
    <div class="mbtns">
      <button id="mcancel">Annuler</button>
      <button id="mok" class="pri">OK</button>
    </div>
  </div>
</div>

<!-- Animation « Rewind » affichée sur tous les écrans -->
<div id="rwfx">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
  <div>Rewind</div>
  <div id="rwtxt"></div>
</div>

<!-- Firebase : chaque module n'est chargé qu'UNE seule fois, avant le script principal -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ============ À REMPLIR : configuration Firebase ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCy9wsO15wIcLkbtSEfO6uKDYEuV7YRQJA",
  authDomain: "hisaux-atoi.firebaseapp.com",
  databaseURL: "https://hisaux-atoi-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hisaux-atoi"
};
/* ============================================================ */

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const $ = id => document.getElementById(id);

// identifiant propre à ce téléphone : sert à retrouver quel joueur j'ai choisi
let dev = localStorage.getItem('tour_dev');
if (!dev){ dev = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('tour_dev', dev); }

let code = null, ref = null, g = null, meIdx = null, hadData = false;
let prevCurrent = null, myTurnSince = 0, rewTimer = null, armed = false, rwBusy = false;
let srvOff = 0, expiringFor = null, tapcTimer = null;
const taps = [];
db.ref('.info/serverTimeOffset').on('value', s => { srvOff = s.val() || 0; });
const nowS = () => Date.now() + srvOff;

const LIGHT = 'radial-gradient(60% 50% at 15% 8%,#bcd6ff 0,transparent 62%),radial-gradient(50% 45% at 92% 18%,#ffd1e4 0,transparent 62%),radial-gradient(60% 50% at 70% 96%,#c6f1dc 0,transparent 62%),#eef2fa';
const PALETTE = ['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1','#d81b60'];

/* ---------- Messages en modale (remplacent alert / confirm) ---------- */
function uiModal(msg, confirmMode, okLabel){
  return new Promise(resolve => {
    const m = $('modal');
    $('mtext').textContent = msg;
    $('mok').textContent = okLabel || 'OK';
    $('mcancel').style.display = confirmMode ? '' : 'none';
    m.classList.add('on');
    const done = v => {
      m.classList.remove('on');
      $('mok').onclick = $('mcancel').onclick = m.onclick = null;
      resolve(v);
    };
    $('mok').onclick = () => done(true);
    $('mcancel').onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
  });
}
const uiAlert = msg => uiModal(msg, false);
const uiConfirm = (msg, okLabel) => uiModal(msg, true, okLabel);

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  $('logout').style.display = id === 'home' ? 'none' : '';
}
// Déconnexion : libère mon joueur, oublie la table sur cet appareil et revient à l'accueil
$('logout').onclick = async () => {
  if (!await uiConfirm('Oublier ta session sur cet appareil et quitter la table ?', 'Déconnexion')) return;
  const r = ref, i = meIdx;
  if (r && i !== null) r.child('claims/' + i).remove().catch(() => {});
  leaveGame();
};
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function textOn(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*gg + 0.114*b) > 150 ? '#111' : '#fff';
}
function hslHex(h, s, l){
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * c).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}
const players = () => (g && g.players) || [];
const norm = s => String(s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// première couleur encore libre (palette d'abord, puis couleurs générées)
function freeColor(){
  const used = players().map(p => String(p.color).toLowerCase());
  for (const c of PALETTE) if (!used.includes(c)) return c;
  for (let h = 15, i = 0; i < 360; i++, h = (h + 47) % 360){
    const c = hslHex(h, 70, 50);
    if (!used.includes(c)) return c;
  }
  return '#888888';
}

// quel joueur ce téléphone a-t-il choisi ?
function myIdx(){
  const c = (g && g.claims) || {};
  for (const k in c) if (c[k] === dev) return +k;
  return null;
}
function claimedCount(){
  const c = (g && g.claims) || {}, n = players().length;
  return Object.keys(c).filter(k => +k < n).length;
}

/* ---------- Accueil ---------- */
function join(c){
  code = c.trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
  if (!code){ $('code').classList.add('bad'); return; }      // champ vide : bordure rouge, sans texte
  localStorage.setItem('tour_code', code);
  $('homeErr').textContent = '';
  meIdx = null;
  hadData = false; creating = false; fxInit = false; lastFx = null; lastWaiting = false; proceeded = false;
  if (ref && gameCb) ref.off('value', gameCb);
  ref = db.ref('games/' + code);
  gameCb = snap => {
    const v = snap.val();
    if (v && v.ended){
      // la partie a été terminée : tout le monde revient à l'accueil
      if (hadData) leaveGame();
      else ref.remove();                 // reste d'une ancienne partie : on nettoie
      return;
    }
    if (!v){
      if (hadData){ leaveGame(); return; }          // la partie a été supprimée
      if (isAdmin()){
        // l'administrateur crée la table, puis la signale aux autres téléphones
        if (!creating){
          creating = true;
          ref.update({current: 0, turn: 1, started: false, options: {rewind: true}})
            .then(() => db.ref('lobby').set({code: code, t: firebase.database.ServerValue.TIMESTAMP}).catch(() => {}))
            .catch(e => { const m = e.message; leaveGame(); $('homeErr').textContent = 'Erreur : ' + m; });
        }
        return;
      }
      const tried = code;
      leaveGame();
      $('code').value = tried;
      $('homeErr').textContent = "Cette partie n'existe pas. Seul l'administrateur peut créer une table.";
      return;
    }
    hadData = true;
    // animation Rewind : jouée sur tous les écrans quand un nouveau rewind est lancé
    const fx = v.rwFx ? v.rwFx.id : null;
    if (!fxInit){ fxInit = true; lastFx = fx; }
    else if (fx && fx !== lastFx){
      lastFx = fx;
      const pl = (v.players || [])[v.rwFx.by];
      playRewind(pl ? pl.name : '');
    }
    g = v;
    render();
  };
  ref.on('value', gameCb, err => { $('homeErr').textContent = 'Erreur Firebase : ' + err.message; show('home'); });
}
let creating = false, fxInit = false, lastFx = null, lastWaiting = false, waiting = false, fxTimer = null;
let gameCb = null, proceeded = false, tableExists = false, lobbyWatch = null, lobbyCb = null;

// bouton de la page de garde : admin = « Créer la table », joueur = « En attente » puis « Rejoindre »
function updateHome(){
  const b = $('go');
  if (isAdmin()){ b.textContent = 'Créer la table'; b.disabled = false; }
  else if (tableExists){ b.textContent = 'Rejoindre'; b.disabled = false; }
  else { b.textContent = 'En attente'; b.disabled = true; }
}
// admin = UID présent dans /admins de la base (les règles Firebase font foi côté serveur)
let adminFlag = false;
const isAdmin = () => adminFlag;
try {
  firebase.auth().onAuthStateChanged(u => {
    adminFlag = false;
    if (!u) return;
    db.ref('admins/' + u.uid).once('value').then(s => {
      adminFlag = !!s.val();
      updateHome();
      if (g && ref) render();            // les droits admin changent l'affichage de la préparation
    }).catch(() => {});
  });
} catch (e) {}
function playRewind(name){
  $('rwtxt').textContent = name ? name + ' revient en arrière' : '';
  $('rwfx').classList.add('on');
  if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
  clearTimeout(fxTimer);
  fxTimer = setTimeout(() => $('rwfx').classList.remove('on'), 2000);
}

// quand l'administrateur crée une table : le champ « nom de la table » des joueurs se remplit
// et leur bouton passe de « En attente » à « Rejoindre »
db.ref('lobby').on('value', s => {
  const v = s.val();
  if (lobbyWatch && lobbyCb){ lobbyWatch.off('value', lobbyCb); lobbyWatch = null; }
  if (!v || !v.code){ tableExists = false; updateHome(); return; }
  lobbyWatch = db.ref('games/' + v.code);
  lobbyCb = gs => {
    const x = gs.val();
    tableExists = !!(x && !x.ended);
    if (tableExists && !isAdmin() && $('home').classList.contains('on')) $('code').value = v.code;
    updateHome();
  };
  lobbyWatch.on('value', lobbyCb, () => {});
}, () => {});
function leaveGame(){
  if (ref && gameCb) ref.off('value', gameCb);
  ref = null; g = null; meIdx = null; hadData = false; prevCurrent = null; proceeded = false;
  disarm();
  localStorage.removeItem('tour_code');
  $('code').value = '';
  show('home');
  updateHome();
}
$('go').onclick = () => join($('code').value);
$('code').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('go').disabled) join($('code').value); });
$('code').addEventListener('input', () => { $('code').classList.remove('bad'); $('homeErr').textContent = ''; });
$('back').onclick = () => leaveGame();

/* ---------- Rendu global ---------- */
function render(){
  if (!g.started) return renderLobby();
  meIdx = myIdx();
  if (meIdx === null && !proceeded) return renderLobby();   // pas encore « Rejoindre »
  if (meIdx === null || meIdx >= players().length) return renderWho();
  renderGame();
}

/* ---------- Préparation ---------- */
function renderLobby(){
  show('lobby');
  $('lobbyCode').textContent = code;
  const adm = isAdmin();
  const list = players(), box = $('plist');
  box.innerHTML = '';
  if (!list.length){
    box.innerHTML = '<div class="hint" style="margin:0">Aucun joueur pour l\'instant.</div>';
  }
  list.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'pl';
    d.innerHTML = `<div class="dot" style="background:${p.color}"></div><div class="nm">${i+1}. ${esc(p.name)}</div>`;
    const up = document.createElement('button'); up.textContent = '↑'; up.disabled = i === 0;
    up.onclick = () => move(i, -1);
    const dn = document.createElement('button'); dn.textContent = '↓'; dn.disabled = i === list.length - 1;
    dn.onclick = () => move(i, 1);
    const rm = document.createElement('button'); rm.textContent = '✕';
    rm.onclick = () => { const a = list.slice(); a.splice(i, 1); ref.child('players').set(a); };
    if (adm) d.append(up, dn);          // seul l'admin change l'ordre
    d.append(rm); box.append(d);
  });
  // admin : « Lancer la partie » ; joueurs : « Rejoindre », actif une fois la partie lancée
  const sb = $('start');
  if (adm && !g.started){ sb.textContent = 'Lancer la partie'; sb.disabled = list.length < 2; }
  else { sb.textContent = 'Rejoindre'; sb.disabled = !g.started; }
  $('rand').style.display = adm ? '' : 'none';
  $('rand').disabled = list.length < 2;
  $('optHurry').checked = !!(g.options && g.options.hurry);
  $('optRewind').checked = !!(g.options && g.options.rewind);
  $('optHurry').disabled = $('optRewind').disabled = !adm;     // seul l'admin change les options
  // si la couleur proposée vient d'être prise (par moi ou un autre téléphone), on en propose une libre
  if (list.some(p => String(p.color).toLowerCase() === $('pcolor').value.toLowerCase())) $('pcolor').value = freeColor();
}
function move(i, d){
  const a = players().slice(), j = i + d;
  [a[i], a[j]] = [a[j], a[i]];
  ref.child('players').set(a);
}
// tire un joueur au hasard et le place en premier (les autres gardent leur ordre, à ajuster avec les flèches)
$('rand').onclick = () => {
  const a = players().slice();
  if (a.length < 2) return;
  const p = a.splice(Math.floor(Math.random() * a.length), 1)[0];
  a.unshift(p);
  ref.child('players').set(a);
};
function nameErr(msg){ $('nameErr').textContent = msg || ''; }
function addPlayer(){
  const name = $('pname').value.trim(), color = $('pcolor').value.toLowerCase();
  if (!name){ nameErr('Saisis un prénom.'); return; }
  let reason = '';
  // transaction : pas de doublon même si deux téléphones ajoutent en même temps
  ref.child('players').transaction(a => {
    a = a || [];
    reason = '';
    if (a.some(p => norm(p.name) === norm(name))){ reason = 'Ce prénom est déjà pris.'; return; }
    if (a.some(p => String(p.color).toLowerCase() === color)){ reason = 'Cette couleur est déjà prise.'; return; }
    a.push({name, color});
    return a;
  }, (err, committed) => {
    if (err){ nameErr(err.code === 'PERMISSION_DENIED' || /permission/i.test(err.message) ? "Seul l'administrateur peut créer une partie." : 'Erreur : ' + err.message); return; }
    if (!committed){ nameErr(reason || 'Impossible d\'ajouter ce joueur.'); return; }
    nameErr('');
    $('pname').value = '';
    $('pcolor').value = freeColor();
    $('pname').focus();
  });
}
$('addP').onclick = addPlayer;
$('pname').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
$('pname').addEventListener('input', () => nameErr(''));
$('pcolor').addEventListener('input', () => nameErr(''));
$('start').onclick = () => {
  if (!g) return;
  if (!g.started){
    if (isAdmin() && players().length >= 2){ proceeded = true; ref.update({started: true, current: 0, turn: 1}); }
  } else { proceeded = true; render(); }
};

/* ---------- Qui es-tu ? ---------- */
function claim(i){
  ref.child('claims/' + i).transaction(v => v ? undefined : dev);   // refusé si déjà pris
}
function renderWho(){
  show('who');
  const box = $('whoList'); box.innerHTML = '';
  const claims = g.claims || {};
  players().forEach((p, i) => {
    const taken = !!claims[i] && claims[i] !== dev;
    const b = document.createElement('button');
    b.innerHTML = esc(p.name) + (taken ? '<small style="display:block;font-size:14px;opacity:.85">déjà pris</small>' : '');
    b.disabled = taken;
    b.style.cssText = `display:block;width:100%;margin:12px 0;padding:24px;font-size:24px;border-radius:24px;` +
      `background-color:${p.color};` +
      `color:${textOn(p.color)};border:1px solid rgba(255,255,255,.7)`;
    b.onclick = () => claim(i);
    box.append(b);
  });
}

/* ---------- Jeu ---------- */
function renderGame(){
  show('game');
  const list = players(), n = list.length;
  const cur = g.current % n, me = list[meIdx], act = list[cur];
  const gs = $('game');

  // tant que tout le monde n'a pas choisi son nom : message d'attente et retour possible
  waiting = claimedCount() < n;
  const mine = cur === meIdx && !waiting;
  $('gback').style.display = waiting ? '' : 'none';
  const wt = $('wait');
  if (waiting){
    const cl = g.claims || {};
    const names = list.filter((p, i) => !cl[i]).map(p => p.name);
    wt.textContent = 'En attente de ' + (names.length > 1
      ? names.slice(0, -1).join(' ; ') + ' et ' + names[names.length - 1]
      : names[0]);
    wt.style.display = '';
  } else wt.style.display = 'none';

  // le stage (carré) prend la couleur du joueur en cours ; toute la carte est cliquable à mon tour
  const st = $('stage');
  st.style.background = `linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 62%),${act.color}`;
  st.style.color = textOn(act.color);
  st.classList.toggle('tap', mine);

  // pastilles d'ordre
  $('strip').innerHTML = list.map((p, i) =>
    `<div class="chip ${i === cur ? 'act' : ''}" style="background:${p.color}"></div>`).join('');
  // « Tour » = une manche complète : le numéro ne change que lorsque tout le monde a joué
  $('turnno').textContent = 'Tour ' + (Math.floor(((g.turn || 1) - 1) / n) + 1);

  // mon nom : pastille à ma couleur, texte adapté
  const mn = $('myname');
  mn.style.setProperty('--pc', me.color);
  mn.style.setProperty('--pt', textOn(me.color));
  mn.querySelector('.nm').textContent = me.name;

  const al = (g.alarm && g.alarm.turn === g.turn) ? g.alarm : null;
  const rem = al ? Math.max(0, Math.ceil((al.until - nowS()) / 1000)) : 0;
  // message « Le tour de X est passé » (affiché ~4 s sur tous les écrans après une alarme)
  const sk = (g.skipped && g.skipped.turn === g.turn && nowS() < g.skipped.until) ? g.skipped : null;
  if (prevCurrent !== cur){ taps.length = 0; $('tapc').textContent = ''; }

  // clignotement : 'flash' (début de tour), 'slow' (alarme), 'fast' (5 dernières secondes)
  const setBlink = m => {
    if (gs.dataset.blink === m) return;
    gs.classList.remove('flash', 'slow', 'fast');
    void gs.offsetWidth;
    if (m) gs.classList.add(m);
    gs.dataset.blink = m;
  };

  if (mine){
    // plein écran à ma couleur
    gs.style.background = `radial-gradient(90% 55% at 50% 0%,rgba(255,255,255,.45),transparent 70%),${me.color}`;
    if (al){
      setBlink(rem <= 5 ? 'fast' : 'slow');
    } else if (prevCurrent !== cur || lastWaiting){
      myTurnSince = Date.now();
      setBlink('');
      setBlink('flash');
      if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 250]);
    } else if (gs.dataset.blink === 'slow' || gs.dataset.blink === 'fast'){
      setBlink('');
    }
  } else {
    setBlink('');
    // fond clair avec une lueur de la couleur du joueur actif
    gs.style.background = `radial-gradient(70% 42% at 50% 30%,${rgba(act.color, .55)},transparent 72%),${LIGHT}`;
  }

  // textes du stage
  const big = $('big'), sub = $('sub');
  big.className = '';
  if (waiting){
    big.textContent = act.name;
    sub.textContent = 'commence';
  } else if (al && rem <= 5){
    big.className = 'num';
    big.textContent = rem;
    sub.textContent = mine ? 'DÉPÊCHE-TOI !' : act.name + ' est trop lent';
  } else if (al){
    if (mine){
      big.textContent = 'DÉPÊCHE-TOI !';
      sub.textContent = 'Ton tour sera passé dans ' + rem + ' s';
    } else {
      big.textContent = act.name;
      sub.textContent = 'Trop lent ! Tour passé dans ' + rem + ' s';
    }
  } else if (sk){
    big.className = 'msg';
    big.textContent = sk.player === meIdx ? 'Ton tour est passé' : 'Le tour de ' + (list[sk.player] ? list[sk.player].name : '') + ' est passé';
    sub.textContent = mine ? 'À toi de jouer !' : act.name + ' joue maintenant';
  } else if (mine){
    big.textContent = 'À TOI !';
    sub.textContent = 'Touche ici quand tu as fini';
  } else {
    big.textContent = act.name;
    sub.textContent = 'est en train de jouer';
  }
  lastWaiting = waiting;
  prevCurrent = cur;
}

// retour au choix du nom (libère mon joueur) tant que tout le monde n'a pas choisi
$('gback').onclick = () => {
  if (!ref || meIdx === null || claimedCount() >= players().length) return;
  const i = meIdx;
  disarm();
  prevCurrent = null;
  ref.child('claims/' + i).remove();
};

function endTurn(){
  if (!g || !g.started || meIdx === null) return;
  const n = players().length, me = meIdx;
  ref.transaction(cur => {
    if (!cur) return cur;
    if ((cur.current % n) !== me) return;           // plus mon tour : on annule
    cur.current = (cur.current + 1) % n;
    cur.turn = (cur.turn || 1) + 1;
    cur.alarm = null; cur.hurry = null;
    return cur;
  });
}
// toute la carte (stage) termine mon tour
$('stage').onclick = () => {
  if (!waiting && prevCurrent === meIdx && Date.now() - myTurnSince > 700) endTurn();   // garde anti-clic accidentel
};

/* ---------- Terminer la partie : base vidée, tout le monde revient à l'accueil ---------- */
$('end').onclick = async () => {
  if (!ref) return;
  if (!await uiConfirm('Terminer la partie pour tous les joueurs ?', 'Terminer')) return;
  const r = ref;
  r.set({ended: true}).then(() => setTimeout(() => r.remove(), 3000));
};

/* ---------- Rewind : on touche son nom ---------- */
// Une seule fois par joueur et par partie ; impossible tant qu'on n'a pas joué (Tour 1)
function canRewind(){
  if (!g || !g.started || meIdx === null) return false;
  if (!(g.options && g.options.rewind)) return false;         // option désactivée par l'admin
  const n = players().length, me = meIdx;
  if (g.rw && g.rw[me]) return false;                         // déjà utilisé
  const c = g.current % n, steps = ((c - me + n) % n) || n;
  return (g.turn || 1) - 1 - steps >= 0;                      // a déjà joué au moins une fois
}
function disarm(){
  armed = false; rwBusy = false;
  clearTimeout(rewTimer);
  $('myname').classList.remove('armed', 'spin');
}
function shake(){
  const el = $('myname');
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function doRewind(){
  const n = players().length, me = meIdx;
  ref.transaction(cur => {
    if (!cur) return cur;
    if (!(cur.options && cur.options.rewind)) return;
    if (cur.rw && cur.rw[me]) return;                          // déjà utilisé
    const c = cur.current % n;
    const steps = ((c - me + n) % n) || n;                    // nb de passages à reculer jusqu'à mon dernier tour
    if ((cur.turn || 1) - 1 - steps < 0) return;              // je n'ai pas encore joué
    cur.current = me;
    cur.turn = (cur.turn || 1) - steps;
    cur.alarm = null; cur.hurry = null;
    cur.rw = cur.rw || {}; cur.rw[me] = true;
    cur.rwFx = {id: Date.now() + '-' + me, by: me};            // déclenche l'animation sur tous les écrans
    return cur;
  });
}
$('myname').onclick = e => {
  e.stopPropagation();
  if (rwBusy) return;
  if (!(g && g.options && g.options.rewind)) return;          // pas de rewind dans cette partie
  if (!armed){
    if (!canRewind()){ shake(); return; }
    armed = true;
    $('myname').classList.add('armed');                        // la zone devient « Rewind »
    clearTimeout(rewTimer);
    rewTimer = setTimeout(disarm, 6000);
    return;
  }
  rwBusy = true;
  clearTimeout(rewTimer);
  $('myname').classList.add('spin');                           // la flèche tourne vite à l'envers
  setTimeout(() => { doRewind(); disarm(); }, 650);
};

/* ---------- Option « Plus vite ! » ---------- */
$('optHurry').onchange = e => { if (isAdmin()) ref.child('options/hurry').set(e.target.checked); };
$('optRewind').onchange = e => { if (isAdmin()) ref.child('options/rewind').set(e.target.checked); };

// Chaque joueur (qui n'est pas actif) compte ses tapotements : 10 en 10 s => il envoie son « vote »
$('game').addEventListener('pointerdown', e => {
  if (!g || !g.started || waiting || meIdx === null || !(g.options && g.options.hurry)) return;
  const n = players().length;
  if (g.current % n === meIdx) return;                       // c'est mon tour : pas de vote
  if (g.alarm && g.alarm.turn === g.turn) return;            // alarme déjà en cours
  if (e.target.closest('#myname,#end,#gback')) return;
  const t = Date.now();
  taps.push(t);
  while (taps.length && t - taps[0] > 10000) taps.shift();
  $('tapc').textContent = taps.length >= 3 ? (Math.min(taps.length, 10) + ' / 10') : '';
  clearTimeout(tapcTimer); tapcTimer = setTimeout(() => { $('tapc').textContent = ''; }, 1500);
  if (taps.length >= 10){ taps.length = 0; $('tapc').textContent = 'Envoyé !'; sendHurry(); }
});

function sendHurry(){
  const n = players().length, me = meIdx;
  ref.transaction(cur => {
    if (!cur) return cur;
    if (!cur.started) return;
    const c = cur.current % n;
    if (c === me) return;
    if (cur.alarm && cur.alarm.turn === cur.turn) return;
    const now = nowS();
    cur.hurry = cur.hurry || {};
    cur.hurry[me] = {t: now, turn: cur.turn};
    let all = true;
    for (let i = 0; i < n; i++){
      if (i === c) continue;
      const h = cur.hurry[i];
      if (!h || h.turn !== cur.turn || now - h.t > 10000){ all = false; break; }
    }
    if (all){ cur.alarm = {player: c, turn: cur.turn, until: now + 30000}; cur.hurry = null; }
    return cur;
  });
}

// Fin de l'alarme : n'importe quel téléphone peut passer le tour (la transaction évite les doublons)
function expireAlarm(){
  const al = g && g.alarm;
  if (!al || expiringFor === al.until) return;
  expiringFor = al.until;
  const n = players().length;
  ref.transaction(cur => {
    if (!cur || !cur.alarm) return cur;
    if (cur.alarm.turn !== cur.turn || nowS() < cur.alarm.until - 1000) return;
    const pen = cur.current % n;                        // joueur pénalisé
    cur.current = (cur.current + 1) % n;
    cur.turn = (cur.turn || 1) + 1;
    cur.alarm = null; cur.hurry = null;
    cur.skipped = {player: pen, turn: cur.turn, until: nowS() + 4000};
    return cur;
  });
}
setInterval(() => {
  if (!g || !g.started || meIdx === null) return;
  const sk = g.skipped;
  const skActive = sk && sk.turn === g.turn && nowS() < sk.until + 600;
  if (!g.alarm && !skActive) return;
  if (g.alarm && nowS() >= g.alarm.until) expireAlarm();
  renderGame();   // met à jour le compte à rebours et le message « tour passé »
}, 500);

/* ---------- Écran toujours allumé ---------- */
let wl = null;
async function keepAwake(){
  try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.addEventListener('click', keepAwake, {once: true});

/* ---------- Reprise automatique ---------- */
updateHome();
const last = localStorage.getItem('tour_code');
if (last){ $('code').value = last; join(last); }
</script>

<!-- Accès administrateur : 3 clics rapides sur le titre de l'accueil -->
<script>
(function () {
  const title = document.querySelector('#home h1');
  if (!title) return;
  title.style.cssText += ';cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation';

  let count = 0, timer = null;
  title.addEventListener('click', () => {
    count++;
    clearTimeout(timer);
    timer = setTimeout(() => { count = 0; }, 800);
    if (count === 3) { count = 0; loginAsAdmin(); }
  });

  function showUid(uid, isAdm) {
    let el = document.getElementById('adminInfo');
    let del = document.getElementById('adminDel');
    let out = document.getElementById('adminOut');
    if (!uid) { if (el) el.remove(); if (del) del.remove(); if (out) out.remove(); return; }
    if (!out) {
      out = document.createElement('button');
      out.id = 'adminOut';
      out.className = 'link';
      out.textContent = 'Déconnexion';
      out.style.cssText = 'position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:5';
      out.onclick = () => firebase.auth().signOut().catch(e => uiAlert('Erreur : ' + e.message));
      document.getElementById('home').appendChild(out);
    }
    if (!isAdm && del) { del.remove(); del = null; }
    if (isAdm && !del) {
      del = document.createElement('button');
      del.id = 'adminDel';
      del.textContent = 'Supprimer les parties en cours';
      del.style.cssText = 'display:block;margin:12px auto;font-size:15px;padding:10px 18px;color:#d93025';
      del.onclick = async () => {
        if (!await uiConfirm('Supprimer toutes les parties en cours ? Tous les joueurs reviendront à l\'accueil.', 'Supprimer')) return;
        db.ref('games').remove().then(() => {
          db.ref('lobby').remove().catch(() => {});
          localStorage.removeItem('tour_code');
          uiAlert('Parties supprimées.');
        }).catch(e => uiAlert('Suppression refusée : ' + e.message + '\n(Vérifie les règles Firebase : droit d\'écriture sur « games » pour l\'admin.)'));
      };
      document.querySelector('#home .wrap').appendChild(del);
    }
    if (!el) {
      el = document.createElement('div');
      el.id = 'adminInfo';
      el.style.cssText = 'margin:12px 0;text-align:center;font-size:13px;color:rgba(27,34,51,.6);user-select:text;-webkit-user-select:text;word-break:break-all';
      document.querySelector('#home .wrap').appendChild(el);
    }
    el.textContent = (isAdm ? 'Administrateur connecté' : 'Connecté (non administrateur)') + ' — UID : ' + uid;
  }
  // le bouton admin n'apparaît que si l'UID figure dans /admins
  function refresh(u) {
    if (!u) { showUid(null); return; }
    showUid(u.uid, false);
    db.ref('admins/' + u.uid).once('value')
      .then(s => showUid(u.uid, !!s.val()))
      .catch(() => showUid(u.uid, false));
  }

  function loginAsAdmin() {
    if (typeof firebase === 'undefined' || typeof firebase.auth !== 'function') {
      uiAlert("Le module Firebase Auth n'est pas chargé (firebase-auth-compat.js).");
      return;
    }
    const auth = firebase.auth();
    if (auth.currentUser) { refresh(auth.currentUser); return; }
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => uiAlert('Erreur de connexion Google :\n' + e.code + '\n' + e.message));
  }

  if (typeof firebase !== 'undefined' && typeof firebase.auth === 'function') {
    firebase.auth().onAuthStateChanged(u => refresh(u));
  }
})();
</script>
